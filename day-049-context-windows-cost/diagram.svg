<circle cx="302.0" cy="168.7" r="3.0" fill="#22a355"/>
<circle cx="360.0" cy="162.1" r="3.0" fill="#22a355"/>
<circle cx="476.0" cy="148.9" r="3.0" fill="#22a355"/>
<circle cx="650.0" cy="129.0" r="3.0" fill="#22a355"/>
<circle cx="302.0" cy="168.7" r="6.0" fill="none" stroke="#d43a2f" stroke-width="2.0"/>
<text x="272" y="138" text-anchor="middle" font-size="9.5" fill="#d43a2f" font-weight="bold">CROSSOVER  T = 16,384</text>
<text x="272" y="152" text-anchor="middle" font-size="9.0" fill="#d43a2f">attention = MLP</text>
<text x="650" y="80" text-anchor="end" font-size="9.5" fill="#0a54c2" font-weight="bold">ATTENTION  4*T^2*d*L</text>
<text x="486" y="170" text-anchor="start" font-size="9.5" fill="#177245" font-weight="bold">MLP  16*T*d^2*L</text>
<text x="70.0" y="254" text-anchor="middle" font-size="8.5" fill="#777777">1K</text>
