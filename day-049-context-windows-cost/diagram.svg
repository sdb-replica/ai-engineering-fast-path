<svg viewBox="0 0 680 484" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
<rect x="0" y="0" width="680" height="484" fill="#ffffff"/>
<text x="340.0" y="24" text-anchor="middle" font-size="13.5" fill="#1c1c1e" font-weight="bold">The context window is a cost curve, not a spec</text>
<text x="340.0" y="41" text-anchor="middle" font-size="9.5" fill="#666666">One model throughout: L=32 layers, d=4096, h=32 heads, fp16 KV cache - log scales on both panels</text>
<rect x="12" y="52" width="656" height="216" rx="10" fill="#ffffff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="340" y="72" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">A - COMPUTE PER FORWARD PASS: ATTENTION (T^2) vs MLP (T)</text>
<line x1="70.0" y1="216.0" x2="650.0" y2="216.0" stroke="#e5e5e5" stroke-width="1.0"/>
<text x="64" y="219.0" text-anchor="end" font-size="8.5" fill="#777777">1T</text>
<line x1="70.0" y1="172.0" x2="650.0" y2="172.0" stroke="#e5e5e5" stroke-width="1.0"/>
