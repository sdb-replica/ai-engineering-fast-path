<text x="76" y="340" text-anchor="start" font-size="9.0" fill="#d43a2f" font-weight="bold">80 GiB - one big GPU, all of it cache</text>
<circle cx="494.7" cy="349.2" r="5.0" fill="none" stroke="#d43a2f" stroke-width="2.0"/>
