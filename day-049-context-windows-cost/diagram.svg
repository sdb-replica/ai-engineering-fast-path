<text x="476.0" y="254" text-anchor="middle" font-size="8.5" fill="#777777">128K</text>
<text x="650.0" y="254" text-anchor="middle" font-size="8.5" fill="#777777">1M</text>
<rect x="12" y="284" width="656" height="184" rx="10" fill="#ffffff" stroke="#7a5cff" stroke-width="1.2"/>
<text x="340" y="304" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">B - KV CACHE IN GiB: LINEAR IN T, BUT 0.5 MiB PER TOKEN</text>
