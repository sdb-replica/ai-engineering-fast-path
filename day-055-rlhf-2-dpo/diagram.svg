<svg viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
<rect x="0" y="0" width="680" height="520" rx="0" fill="#ffffff" stroke="none" stroke-width="1.0"/>
<text x="340.0" y="24" text-anchor="middle" font-size="13.5" fill="#1c1c1e" font-weight="bold">DPO: the reward was inside the policy all along</text>
<text x="340.0" y="41" text-anchor="middle" font-size="9.5" fill="#666666">Day 54's three-stage pipeline vs today's one loss - and the gap that loss widens</text>
<rect x="12" y="56" width="656" height="118" rx="10" fill="#ffffff" stroke="#c77400" stroke-width="1.2"/>
<text x="340.0" y="76" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">A - RLHF (DAY 54): THREE STAGES, TWO EXTRA MODELS</text>
