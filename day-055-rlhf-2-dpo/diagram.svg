<text x="114.0" y="112" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">SFT model</text>
<text x="114.0" y="130" text-anchor="middle" font-size="8.5" fill="#555555">pi_ref, from Day 52</text>
<line x1="206" y1="115" x2="248" y2="115" stroke="#c77400" stroke-width="1.6"/>
<polygon points="250,115 243,111 243,119" fill="#c77400"/>
<rect x="250" y="90" width="180" height="50" rx="8" fill="#fff8e6" stroke="#c77400" stroke-width="1.2"/>
