<text x="566.0" y="112" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">PPO loop</text>
<text x="566.0" y="130" text-anchor="middle" font-size="8.5" fill="#555555">sample, score, RL update</text>
<text x="340.0" y="162" text-anchor="middle" font-size="9.0" fill="#1c1c1e">heavy machinery: an RM to train + a sampler + an RL loop, all leashed to pi_ref by a KL penalty</text>
<rect x="12" y="188" width="656" height="118" rx="10" fill="#ffffff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="340.0" y="208" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">B - DPO (TODAY): SAME PAIRS, NO MIDDLE STAGES</text>
<rect x="24" y="222" width="180" height="50" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="114.0" y="244" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">SFT model</text>
<text x="114.0" y="262" text-anchor="middle" font-size="8.5" fill="#555555">pi_ref - frozen, read-only</text>
<line x1="206" y1="247" x2="248" y2="247" stroke="#0a7aff" stroke-width="1.6"/>
<polygon points="250,247 243,243 243,251" fill="#0a7aff"/>
<rect x="250" y="222" width="180" height="50" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="340.0" y="244" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">Preference pairs</text>
<text x="340.0" y="262" text-anchor="middle" font-size="8.5" fill="#555555">the same pairs as Day 54</text>
<line x1="432" y1="247" x2="474" y2="247" stroke="#0a7aff" stroke-width="1.6"/>
<polygon points="476,247 469,243 469,251" fill="#0a7aff"/>
<rect x="476" y="222" width="180" height="50" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="566.0" y="244" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">Policy</text>
<text x="566.0" y="262" text-anchor="middle" font-size="8.5" fill="#555555">trained directly on the pairs</text>
<text x="340.0" y="294" text-anchor="middle" font-size="9.0" fill="#0a54c2">one loss: -log sigmoid( beta * [ gap(chosen) - gap(rejected) ] ),  gap(y) = log pi(y) - log pi_ref(y)</text>
<rect x="12" y="320" width="656" height="184" rx="10" fill="#ffffff" stroke="#22a355" stroke-width="1.2"/>
<text x="340.0" y="340" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">C - THE GAP WIDENS: IMPLICIT-REWARD MARGIN r(chosen) - r(rejected)</text>
<text x="340.0" y="358" text-anchor="middle" font-size="9.0" fill="#1c1c1e">10 SGD steps on one pair, beta = 1:  loss 0.6931 -&gt; 0.0474  |  r(chosen) 0.0000 -&gt; +0.8400  |  r(rejected) 0.0000 -&gt; -2.1850</text>
