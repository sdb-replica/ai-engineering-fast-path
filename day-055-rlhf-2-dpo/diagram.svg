<text x="340.0" y="130" text-anchor="middle" font-size="8.5" fill="#555555">trained on preference pairs</text>
<line x1="432" y1="115" x2="474" y2="115" stroke="#c77400" stroke-width="1.6"/>
<polygon points="476,115 469,111 469,119" fill="#c77400"/>
