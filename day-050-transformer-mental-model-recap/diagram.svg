<polygon points="566,303 559,299 559,307" fill="#7a5cff"/>
<text x="508" y="348" text-anchor="middle" font-size="9" fill="#1c1c1e">each step recomputes ONE position, not the prefix</text>
<text x="508" y="364" text-anchor="middle" font-size="9" fill="#555555">context cost grows quadratically (Day 49)</text>
<rect x="12" y="388" width="656" height="54" rx="10" fill="#fff8e6" stroke="#d99a00" stroke-width="1.2"/>
<text x="340" y="410" text-anchor="middle" font-size="9.5" fill="#1c1c1e" font-weight="bold">One sentence: a residual stream, read and written by attention + MLP sublayers,</text>
<text x="340" y="428" text-anchor="middle" font-size="9.5" fill="#1c1c1e" font-weight="bold">trained by next-token prediction, run one cached token at a time.</text>
