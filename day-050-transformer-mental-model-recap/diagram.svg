<text x="402.0" y="301" text-anchor="middle" font-size="8.5" fill="#1c1c1e" font-weight="bold">sample</text>
<text x="402.0" y="316" text-anchor="middle" font-size="8" fill="#555555">(Day 47)</text>
<rect x="464" y="282" width="84" height="42" rx="8" fill="#f1efff" stroke="#7a5cff" stroke-width="1.2"/>
<text x="506.0" y="301" text-anchor="middle" font-size="8.5" fill="#1c1c1e" font-weight="bold">append</text>
<text x="506.0" y="316" text-anchor="middle" font-size="8" fill="#555555">loop back</text>
<rect x="568" y="282" width="84" height="42" rx="8" fill="#f1efff" stroke="#7a5cff" stroke-width="1.2"/>
