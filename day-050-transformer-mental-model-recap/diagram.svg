<text x="340" y="157.5" text-anchor="middle" font-size="9" fill="#1c1c1e">RESIDUAL STREAM (B, T, C) - sublayers READ it and ADD their result back; nothing replaces it</text>
<rect x="28" y="174" width="300" height="50" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="178.0" y="194" text-anchor="middle" font-size="10" fill="#1c1c1e" font-weight="bold">WRITER 1 - ATTENTION (Days 36-39)</text>
<text x="178.0" y="210" text-anchor="middle" font-size="8.5" fill="#555555">moves information between positions</text>
<text x="178" y="212" text-anchor="middle" font-size="8.5" fill="#555555">Q/K/V reads (D37) - by hand (D38) - heads (D39)</text>
<rect x="352" y="174" width="300" height="50" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="502.0" y="194" text-anchor="middle" font-size="10" fill="#1c1c1e" font-weight="bold">WRITER 2 - MLP (Days 21, 40)</text>
<text x="502.0" y="210" text-anchor="middle" font-size="8.5" fill="#555555">computes inside each position</text>
<text x="502" y="212" text-anchor="middle" font-size="8.5" fill="#555555">widen - bend - narrow; never looks sideways</text>
