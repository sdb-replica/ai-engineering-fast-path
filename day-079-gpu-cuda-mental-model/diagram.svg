<text x="238.315" y="494" text-anchor="middle" font-size="8" fill="#666666">1</text>
<line x1="360" y1="474" x2="360" y2="482" stroke="#999999" stroke-width="1.2"/>
<text x="360" y="494" text-anchor="middle" font-size="8" fill="#666666">10</text>
<line x1="481.685" y1="474" x2="481.685" y2="482" stroke="#999999" stroke-width="1.2"/>
<text x="481.685" y="494" text-anchor="middle" font-size="8" fill="#666666">100</text>
<line x1="603.369" y1="474" x2="603.369" y2="482" stroke="#999999" stroke-width="1.2"/>
<text x="603.369" y="494" text-anchor="middle" font-size="8" fill="#666666">1000</text>
<text x="340" y="508" text-anchor="middle" font-size="8" fill="#666666">arithmetic intensity (FLOP/byte, log scale)</text>
<line x1="106.784" y1="458" x2="106.784" y2="478" stroke="#c22f2f" stroke-width="1.6"/>
<circle cx="106.784" cy="478" r="4" fill="#c22f2f"/>
<text x="106.784" y="448" text-anchor="middle" font-size="8.5" fill="#c22f2f" font-weight="bold">add 0.08</text>
<line x1="238.315" y1="458" x2="238.315" y2="478" stroke="#c22f2f" stroke-width="1.6"/>
<circle cx="238.315" cy="478" r="4" fill="#c22f2f"/>
<text x="238.315" y="448" text-anchor="middle" font-size="8.5" fill="#c22f2f" font-weight="bold">decode 1.0</text>
<line x1="538.855" y1="458" x2="538.855" y2="478" stroke="#d99a00" stroke-width="1.6" stroke-dasharray="4,3"/>
<circle cx="538.855" cy="478" r="4" fill="#d99a00"/>
<text x="538.855" y="448" text-anchor="middle" font-size="8.5" fill="#d99a00" font-weight="bold">RIDGE 295</text>
<line x1="619.813" y1="458" x2="619.813" y2="478" stroke="#177245" stroke-width="1.6"/>
<circle cx="619.813" cy="478" r="4" fill="#177245"/>
<text x="619.813" y="448" text-anchor="middle" font-size="8.5" fill="#177245" font-weight="bold">matmul 1365</text>
<text x="340" y="432" text-anchor="middle" font-size="8.5" fill="#555555">left of the ridge: memory-bound (bandwidth decides)  -  right of it: compute-bound (FLOPs decide)</text>
</svg>
