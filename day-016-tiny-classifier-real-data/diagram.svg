<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 802" role="img" aria-label="End-to-end classifier pipeline">
<text x="320" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">every day you built one part — today the whole machine runs</text>
<defs><marker id="d16arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#555"/></marker></defs>
<rect x="80" y="52" width="480" height="62" rx="12" fill="#ffffff" stroke="#0a7aff" stroke-width="2.5"/>
<circle cx="114" cy="83" r="20" fill="#0a7aff"/>
<text x="114" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
<text x="144" y="78" font-size="13.5" font-weight="700" fill="currentColor">DATA — sklearn digits</text>
<text x="144" y="98" font-size="11.5" fill="currentColor">1,797 handwritten digits · 64 pixel features (8×8)</text>
<text x="546" y="78" text-anchor="end" font-size="10.5" font-weight="700" fill="#0a7aff">Day 2</text>
<rect x="80" y="160" width="480" height="62" rx="12" fill="#ffffff" stroke="#0a7aff" stroke-width="2.5"/>
<circle cx="114" cy="191" r="20" fill="#0a7aff"/>
<text x="114" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
<text x="144" y="186" font-size="13.5" font-weight="700" fill="currentColor">SPLIT — 80 / 20</text>
<text x="144" y="206" font-size="11.5" fill="currentColor">train 1,437 · val 360 · random_state = 16</text>
<text x="546" y="186" text-anchor="end" font-size="10.5" font-weight="700" fill="#0a7aff">Day 8</text>
<line x1="320" y1="114" x2="320" y2="160" stroke="#555" stroke-width="2" marker-end="url(#d16arr)"/>
<rect x="80" y="268" width="480" height="62" rx="12" fill="#ffffff" stroke="#0a7aff" stroke-width="2.5"/>
<circle cx="114" cy="299" r="20" fill="#0a7aff"/>
<text x="114" y="304" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text>
<text x="144" y="294" font-size="13.5" font-weight="700" fill="currentColor">SCALE — pixels ÷ 16</text>
<text x="144" y="314" font-size="11.5" fill="currentColor">values 0..16 → 0..1 · keeps the math well-behaved</text>
<text x="546" y="294" text-anchor="end" font-size="10.5" font-weight="700" fill="#0a7aff">Day 2</text>
<line x1="320" y1="222" x2="320" y2="268" stroke="#555" stroke-width="2" marker-end="url(#d16arr)"/>
<rect x="80" y="376" width="480" height="62" rx="12" fill="#ffffff" stroke="#7a5cff" stroke-width="2.5"/>
<circle cx="114" cy="407" r="20" fill="#7a5cff"/>
<text x="114" y="412" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">4</text>
<text x="144" y="402" font-size="13.5" font-weight="700" fill="currentColor">MODEL — 64 → 32 → 10</text>
<text x="144" y="422" font-size="11.5" fill="currentColor">Linear(64,32) → ReLU → Linear(32,10) · 32 stacked dot products</text>
<text x="546" y="402" text-anchor="end" font-size="10.5" font-weight="700" fill="#7a5cff">Day 12</text>
<line x1="320" y1="330" x2="320" y2="376" stroke="#555" stroke-width="2" marker-end="url(#d16arr)"/>
<rect x="80" y="484" width="480" height="62" rx="12" fill="#ffffff" stroke="#7a5cff" stroke-width="2.5"/>
<circle cx="114" cy="515" r="20" fill="#7a5cff"/>
<text x="114" y="520" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">5</text>
<text x="144" y="510" font-size="13.5" font-weight="700" fill="currentColor">LOSS — cross-entropy</text>
<text x="144" y="530" font-size="11.5" fill="currentColor">softmax(logits) vs one-hot truth · −log p_true</text>
<text x="546" y="510" text-anchor="end" font-size="10.5" font-weight="700" fill="#7a5cff">Day 14</text>
<line x1="320" y1="438" x2="320" y2="484" stroke="#555" stroke-width="2" marker-end="url(#d16arr)"/>
<rect x="80" y="592" width="480" height="62" rx="12" fill="#ffffff" stroke="#22a355" stroke-width="2.5"/>
<circle cx="114" cy="623" r="20" fill="#22a355"/>
<text x="114" y="628" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">6</text>
<text x="144" y="618" font-size="13.5" font-weight="700" fill="currentColor">LOOP — the Day-7 ritual</text>
<text x="144" y="638" font-size="11.5" fill="currentColor">forward → loss → backward → SGD step · lr 0.5 · batch 64 · 20 epochs</text>
<text x="546" y="618" text-anchor="end" font-size="10.5" font-weight="700" fill="#22a355">Days 4, 6, 7</text>
<line x1="320" y1="546" x2="320" y2="592" stroke="#555" stroke-width="2" marker-end="url(#d16arr)"/>
<rect x="80" y="700" width="480" height="62" rx="12" fill="#ffffff" stroke="#d99a00" stroke-width="2.5"/>
<circle cx="114" cy="731" r="20" fill="#d99a00"/>
<text x="114" y="736" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">7</text>
<text x="144" y="726" font-size="13.5" font-weight="700" fill="currentColor">EVAL — val accuracy 95.6%</text>
<text x="144" y="746" font-size="11.5" fill="currentColor">train loss 0.84 → 0.07 · scored on digits it never trained on</text>
<text x="546" y="726" text-anchor="end" font-size="10.5" font-weight="700" fill="#d99a00">Day 8</text>
<line x1="320" y1="654" x2="320" y2="700" stroke="#555" stroke-width="2" marker-end="url(#d16arr)"/>
<path d="M 564 623 C 594 623, 594 407, 564 407" fill="none" stroke="#22a355" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#d16arr)"/>
<text x="600" y="455" font-size="11.5" font-weight="700" fill="#22a355">×20</text>
</svg>
