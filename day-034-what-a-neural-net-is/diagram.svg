<svg viewBox="0 0 680 472" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
<rect x="0" y="0" width="680" height="472" rx="0" fill="#ffffff" stroke="none" stroke-width="1.0"/>
<text x="340.0" y="24" text-anchor="middle" font-size="13.5" fill="#1c1c1e" font-weight="bold">What a neural net IS: one composed function + an optimizer</text>
<text x="340.0" y="41" text-anchor="middle" font-size="9.5" fill="#666666">Phase B (Days 21-33) on one page - architecture is the shape, theta is the function</text>
<rect x="12" y="56" width="656" height="168" rx="10" fill="#ffffff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="340.0" y="76" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">A - THE FUNCTION:  f(x) = L2 ( relu ( L1 ( x ) ) )      theta = 17 numbers</text>
<rect x="28" y="96" width="72" height="52" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="64.0" y="118" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">x</text>
<text x="64.0" y="136" text-anchor="middle" font-size="8.5" fill="#555555">input</text>
<rect x="128" y="96" width="110" height="52" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="183.0" y="118" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">Linear L1</text>
<text x="183.0" y="136" text-anchor="middle" font-size="8.5" fill="#555555">W1,b1 - Day 21</text>
<rect x="266" y="96" width="84" height="52" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="308.0" y="118" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">ReLU</text>
<text x="308.0" y="136" text-anchor="middle" font-size="8.5" fill="#555555">bend - Day 22</text>
<rect x="378" y="96" width="110" height="52" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="433.0" y="118" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">Linear L2</text>
<text x="433.0" y="136" text-anchor="middle" font-size="8.5" fill="#555555">W2,b2 - Day 21</text>
<rect x="516" y="96" width="84" height="52" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="558.0" y="118" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">y-hat</text>
<text x="558.0" y="136" text-anchor="middle" font-size="8.5" fill="#555555">prediction</text>
<line x1="102" y1="122" x2="126" y2="122" stroke="#0a7aff" stroke-width="1.6"/>
<polygon points="126,122 119,118 119,126" fill="#0a7aff"/>
<line x1="240" y1="122" x2="264" y2="122" stroke="#0a7aff" stroke-width="1.6"/>
<polygon points="264,122 257,118 257,126" fill="#0a7aff"/>
<line x1="352" y1="122" x2="376" y2="122" stroke="#0a7aff" stroke-width="1.6"/>
<polygon points="376,122 369,118 369,126" fill="#0a7aff"/>
<line x1="490" y1="122" x2="514" y2="122" stroke="#0a7aff" stroke-width="1.6"/>
<polygon points="514,122 507,118 507,126" fill="#0a7aff"/>
<text x="340.0" y="176" text-anchor="middle" font-size="9.0" fill="#1c1c1e">input [0, 1]:  z1 [-1, 1, 0, 0.8]  -&gt;  h [0, 1, 0, 0.8]  -&gt;  pred 0.6000  (loss 0.070625)</text>
<text x="340.0" y="196" text-anchor="middle" font-size="9.0" fill="#1c1c1e">swap any piece, same shape:  Linear &lt;-&gt; Conv (Day 26) &lt;-&gt; RNN cell (Day 28)   |   ReLU &lt;-&gt; tanh / norm (Days 22, 29)</text>
<text x="340.0" y="214" text-anchor="middle" font-size="9.0" fill="#0a54c2">counts prove it:  MLP 17 params  -  one Conv2d 80  -  one RNN cell 10  -  TabMLP 113  -  all just f_theta</text>
<rect x="12" y="238" width="656" height="150" rx="10" fill="#ffffff" stroke="#22a355" stroke-width="1.2"/>
<text x="340.0" y="258" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">B - THE EDITOR:  THE OPTIMIZER REWRITES THETA FROM THE FUNCTION&#x27;S OWN GRADIENTS</text>
<rect x="28" y="278" width="110" height="52" rx="8" fill="#e9f9ee" stroke="#22a355" stroke-width="1.2"/>
<text x="83.0" y="300" text-anchor="middle" font-size="10" fill="#1c1c1e" font-weight="bold">Loss</text>
<text x="83.0" y="318" text-anchor="middle" font-size="8.5" fill="#555555">y-hat vs y - Day 5</text>
<rect x="166" y="278" width="120" height="52" rx="8" fill="#e9f9ee" stroke="#22a355" stroke-width="1.2"/>
<text x="226.0" y="300" text-anchor="middle" font-size="10" fill="#1c1c1e" font-weight="bold">backward()</text>
<text x="226.0" y="318" text-anchor="middle" font-size="8.5" fill="#555555">blame - Day 23</text>
<rect x="314" y="278" width="130" height="52" rx="8" fill="#e9f9ee" stroke="#22a355" stroke-width="1.2"/>
<text x="379.0" y="300" text-anchor="middle" font-size="10" fill="#1c1c1e" font-weight="bold">Optimizer</text>
<text x="379.0" y="318" text-anchor="middle" font-size="8.5" fill="#555555">SGD / Adam - Day 18</text>
<rect x="472" y="278" width="150" height="52" rx="8" fill="#e9f9ee" stroke="#22a355" stroke-width="1.2"/>
<text x="547.0" y="300" text-anchor="middle" font-size="9.5" fill="#1c1c1e" font-weight="bold">theta -= lr x grad</text>
<text x="547.0" y="318" text-anchor="middle" font-size="8.5" fill="#555555">the edit - Day 7 loop</text>
<line x1="140" y1="304" x2="164" y2="304" stroke="#22a355" stroke-width="1.6"/>
<polygon points="164,304 157,300 157,308" fill="#22a355"/>
<line x1="288" y1="304" x2="312" y2="304" stroke="#22a355" stroke-width="1.6"/>
<polygon points="312,304 305,300 305,308" fill="#22a355"/>
<line x1="446" y1="304" x2="470" y2="304" stroke="#22a355" stroke-width="1.6"/>
<polygon points="470,304 463,300 463,308" fill="#22a355"/>
<text x="340.0" y="352" text-anchor="middle" font-size="9.0" fill="#1c1c1e">loop back: new theta = a NEW function  -  repeat until the loss curve says stop (Day 31)</text>
<text x="340.0" y="372" text-anchor="middle" font-size="9.0" fill="#177245">no step: frozen at 0.070625  |  100 steps: 0.000005  |  restore theta: 0.070625 again</text>
<rect x="12" y="402" width="656" height="54" rx="10" fill="#fff8e6" stroke="#d99a00" stroke-width="1.2"/>
<text x="340.0" y="422" text-anchor="middle" font-size="9.5" fill="#1c1c1e" font-weight="bold">Init sets the starting theta (Day 33)  -  hyperparams tune the editor (Day 30)  -  debugging reads the loop (Day 31)</text>
<text x="340.0" y="441" text-anchor="middle" font-size="9.5" fill="#1c1c1e">No differentiability, no blame. No optimizer, no learning. Both halves, or nothing moves.</text>
</svg>
