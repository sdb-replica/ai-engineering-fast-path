<text x="241.0" y="221" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">Model (again)</text>
<text x="241.0" y="238" text-anchor="middle" font-size="8.5" fill="#555555">reads the result,</text>
<text x="241.0" y="252" text-anchor="middle" font-size="8.5" fill="#555555">writes the answer</text>
<rect x="28" y="196" width="110" height="64" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="83.0" y="221" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">Answer</text>
<text x="83.0" y="238" text-anchor="middle" font-size="8.5" fill="#555555">prose reply</text>
<text x="83.0" y="252" text-anchor="middle" font-size="8.5" fill="#555555">back to user</text>
