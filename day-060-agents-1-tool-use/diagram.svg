<text x="241.0" y="117" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">Model</text>
<text x="241.0" y="134" text-anchor="middle" font-size="8.5" fill="#555555">picks a tool, fills</text>
<text x="241.0" y="148" text-anchor="middle" font-size="8.5" fill="#555555">the form - runs NOTHING</text>
<rect x="344" y="92" width="166" height="64" rx="8" fill="#fff8e6" stroke="#d99a00" stroke-width="1.2"/>
<text x="427.0" y="117" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">tool_call (JSON)</text>
<text x="427.0" y="134" text-anchor="middle" font-size="8.5" fill="#555555">get_quote + arguments</text>
<text x="427.0" y="148" text-anchor="middle" font-size="8.5" fill="#555555">{"symbol": "NVDA"}</text>
