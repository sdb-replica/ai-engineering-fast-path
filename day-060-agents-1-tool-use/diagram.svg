<text x="340" y="24" text-anchor="middle" font-size="13.5" fill="#1c1c1e" font-weight="bold">Tool use: one round-trip, done by hand</text>
<text x="340" y="41" text-anchor="middle" font-size="9.5" fill="#666666">The model emits a form. Your code validates it, runs it, hands the result back.</text>
