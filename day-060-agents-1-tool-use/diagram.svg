<line x1="140" y1="228" x2="146" y2="232" stroke="#0a7aff" stroke-width="1.6"/>
<text x="340" y="292" text-anchor="middle" font-size="9.0" fill="#1c1c1e">The model ran NOTHING. It picked a name and filled a form - every real action happened on your side.</text>
<text x="340" y="312" text-anchor="middle" font-size="9.0" fill="#1c1c1e">Validation sits between the call and the tool: a malformed form never reaches the function.</text>
<text x="340" y="332" text-anchor="middle" font-size="9.0" fill="#b03030">Rejected in today's code: symbol = 142 (integer, not string) + invented field 'venue' - rejected, not executed.</text>
<text x="340" y="354" text-anchor="middle" font-size="9.0" fill="#0a54c2">One round-trip, by hand. The model speaks only in messages - before, during, and after the call.</text>
<rect x="12" y="390" width="656" height="118" rx="10" fill="#ffffff" stroke="#7a5cff" stroke-width="1.2"/>
<text x="340" y="410" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">B - THE CONTRACT: THE SCHEMA IS THE INTERFACE</text>
<text x="28" y="434" text-anchor="start" font-size="9.0" fill="#1c1c1e">name:  get_quote</text>
<text x="28" y="452" text-anchor="start" font-size="9.0" fill="#1c1c1e">description:  "Last traded price for one ticker symbol."</text>
<text x="28" y="470" text-anchor="start" font-size="9.0" fill="#1c1c1e">parameters:  symbol - string, REQUIRED, one of [NVDA, META, SPY, HOOD, BTC]</text>
<text x="340" y="492" text-anchor="middle" font-size="9.0" fill="#5a3fd4">The model sees ONLY this - not your code, not your table. Vague description in, wrong picks out.</text>
<rect x="12" y="524" width="656" height="60" rx="10" fill="#fdf0f0" stroke="#d64545" stroke-width="1.2"/>
<text x="340" y="546" text-anchor="middle" font-size="9.5" fill="#1c1c1e" font-weight="bold">WHERE IT BREAKS - CALLER PROBLEMS YOUR SIDE MUST ABSORB</text>
<text x="340" y="568" text-anchor="middle" font-size="8.5" fill="#7a2020">hallucinated args: validate and reject  -  wrong tool, valid args: executes the wrong thing  -  sloppy schema: sloppy calls</text>
</svg>
