<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif" role="img" aria-label="Tensor shape ladder: scalar, vector, matrix, 3-D tensor, and a candles matrix">
  <text x="20" y="26" font-size="14" font-weight="700" fill="currentColor">Every dimension adds one index</text>

  <!-- scalar -->
  <rect x="42" y="88" width="70" height="54" rx="10" fill="#eef4ff" stroke="#0a7aff" stroke-width="2"/>
  <text x="77" y="121" font-size="17" font-weight="700" text-anchor="middle" fill="#0a54c2">42.0</text>
  <text x="77" y="172" font-size="12" font-weight="700" text-anchor="middle" fill="currentColor">scalar</text>
  <text x="77" y="190" font-size="11" text-anchor="middle" fill="#777">shape: []</text>
  <text x="77" y="208" font-size="11" text-anchor="middle" fill="#777">ndim 0 · one number</text>

  <!-- vector -->
  <text x="148" y="130" font-size="34" fill="#0a7aff">[</text>
  <rect x="162" y="96" width="42" height="46" rx="6" fill="#eef4ff" stroke="#0a7aff" stroke-width="2"/>
  <rect x="210" y="96" width="42" height="46" rx="6" fill="#eef4ff" stroke="#0a7aff" stroke-width="2"/>
  <rect x="258" y="96" width="42" height="46" rx="6" fill="#eef4ff" stroke="#0a7aff" stroke-width="2"/>
  <text x="183" y="125" font-size="12" text-anchor="middle" fill="#0a54c2">101.9</text>
  <text x="231" y="125" font-size="12" text-anchor="middle" fill="#0a54c2">103.7</text>
  <text x="279" y="125" font-size="12" text-anchor="middle" fill="#0a54c2">99.8</text>
  <text x="304" y="130" font-size="34" fill="#0a7aff">]</text>
  <text x="231" y="172" font-size="12" font-weight="700" text-anchor="middle" fill="currentColor">vector</text>
  <text x="231" y="190" font-size="11" text-anchor="middle" fill="#777">shape: [3]</text>
  <text x="231" y="208" font-size="11" text-anchor="middle" fill="#777">ndim 1 · one index: v[2]</text>

  <!-- matrix -->
  <text x="322" y="126" font-size="34" fill="#0a7aff">[</text>
  <rect x="336" y="76" width="30" height="24" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.5"/>
  <rect x="370" y="76" width="30" height="24" fill="#ffffff" stroke="#0a7aff" stroke-width="1.5"/>
  <rect x="404" y="76" width="30" height="24" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.5"/>
  <rect x="438" y="76" width="30" height="24" fill="#ffffff" stroke="#0a7aff" stroke-width="1.5"/>
  <rect x="336" y="103" width="30" height="24" fill="#ffffff" stroke="#0a7aff" stroke-width="1.5"/>
  <rect x="370" y="103" width="30" height="24" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.5"/>
  <rect x="404" y="103" width="30" height="24" fill="#ffffff" stroke="#0a7aff" stroke-width="1.5"/>
  <rect x="438" y="103" width="30" height="24" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.5"/>
  <rect x="336" y="130" width="30" height="24" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.5"/>
  <rect x="370" y="130" width="30" height="24" fill="#ffffff" stroke="#0a7aff" stroke-width="1.5"/>
  <rect x="404" y="130" width="30" height="24" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.5"/>
  <rect x="438" y="130" width="30" height="24" fill="#ffffff" stroke="#0a7aff" stroke-width="1.5"/>
  <text x="472" y="126" font-size="34" fill="#0a7aff">]</text>
  <text x="402" y="172" font-size="12" font-weight="700" text-anchor="middle" fill="currentColor">matrix</text>
  <text x="402" y="190" font-size="11" text-anchor="middle" fill="#777">shape: [3, 4]</text>
  <text x="402" y="208" font-size="11" text-anchor="middle" fill="#777">ndim 2 · two indices: m[1, 2]</text>

  <!-- 3-D tensor -->
  <line x1="520" y1="84" x2="544" y2="62" stroke="#0a7aff" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="636" y1="84" x2="660" y2="62" stroke="#0a7aff" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="520" y1="160" x2="544" y2="138" stroke="#0a7aff" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="636" y1="160" x2="660" y2="138" stroke="#0a7aff" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="520" y="84" width="116" height="76" rx="6" fill="#eef4ff" stroke="#0a7aff" stroke-width="2"/>
  <rect x="544" y="62" width="116" height="76" rx="6" fill="#ffffff" fill-opacity="0.9" stroke="#0a7aff" stroke-width="2"/>
  <text x="590" y="172" font-size="12" font-weight="700" text-anchor="middle" fill="currentColor">3-D tensor</text>
  <text x="590" y="190" font-size="11" text-anchor="middle" fill="#777">shape: [2, 3, 4]</text>
  <text x="590" y="208" font-size="11" text-anchor="middle" fill="#777">ndim 3 · t[1, 2, 0]</text>

  <!-- panel 2 -->
  <text x="20" y="240" font-size="14" font-weight="700" fill="currentColor">Same idea, your world: a week of candles</text>
  <text x="20" y="258" font-size="11" fill="#777">rows = days (dim 0) · columns = O H L C V (dim 1)</text>

  <text x="115" y="278" font-size="11" font-weight="700" text-anchor="middle" fill="#0a7aff">O</text>
  <text x="169" y="278" font-size="11" font-weight="700" text-anchor="middle" fill="#0a7aff">H</text>
  <text x="223" y="278" font-size="11" font-weight="700" text-anchor="middle" fill="#0a7aff">L</text>
  <text x="277" y="278" font-size="11" font-weight="700" text-anchor="middle" fill="#0a7aff">C</text>
  <text x="331" y="278" font-size="11" font-weight="700" text-anchor="middle" fill="#0a7aff">V</text>

  <text x="82" y="305" font-size="11" text-anchor="end" fill="#777">d0</text>
  <text x="82" y="339" font-size="11" text-anchor="end" fill="#777">d1</text>
  <text x="82" y="373" font-size="11" text-anchor="end" fill="#777">d2</text>
  <text x="82" y="407" font-size="11" text-anchor="end" fill="#777">d3</text>
  <text x="82" y="441" font-size="11" text-anchor="end" fill="#777">d4</text>

  <g fill="#ffffff" stroke="#c8c8c8" stroke-width="1.5">
    <rect x="90" y="286" width="50" height="30" rx="4"/><rect x="144" y="286" width="50" height="30" rx="4"/><rect x="198" y="286" width="50" height="30" rx="4"/><rect x="252" y="286" width="50" height="30" rx="4"/><rect x="306" y="286" width="50" height="30" rx="4"/>
    <rect x="90" y="320" width="50" height="30" rx="4"/><rect x="144" y="320" width="50" height="30" rx="4"/><rect x="198" y="320" width="50" height="30" rx="4"/><rect x="252" y="320" width="50" height="30" rx="4"/><rect x="306" y="320" width="50" height="30" rx="4"/>
    <rect x="90" y="354" width="50" height="30" rx="4"/><rect x="144" y="354" width="50" height="30" rx="4"/><rect x="198" y="354" width="50" height="30" rx="4"/><rect x="306" y="354" width="50" height="30" rx="4"/>
    <rect x="90" y="388" width="50" height="30" rx="4"/><rect x="144" y="388" width="50" height="30" rx="4"/><rect x="198" y="388" width="50" height="30" rx="4"/><rect x="252" y="388" width="50" height="30" rx="4"/><rect x="306" y="388" width="50" height="30" rx="4"/>
    <rect x="90" y="422" width="50" height="30" rx="4"/><rect x="144" y="422" width="50" height="30" rx="4"/><rect x="198" y="422" width="50" height="30" rx="4"/><rect x="252" y="422" width="50" height="30" rx="4"/><rect x="306" y="422" width="50" height="30" rx="4"/>
  </g>
  <rect x="252" y="354" width="50" height="30" rx="4" fill="#fff3c4" stroke="#d99a00" stroke-width="2"/>

  <line x1="64" y1="286" x2="64" y2="452" stroke="#0a7aff" stroke-width="1.5"/>
  <text x="48" y="369" font-size="11" text-anchor="middle" fill="#0a7aff" transform="rotate(-90 48 369)">dim 0 → days</text>

  <text x="386" y="306" font-size="13" font-weight="700" fill="currentColor">x[2, 3] = day-2 close</text>
  <text x="386" y="328" font-size="11" fill="#777">two dimensions → two indices.</text>
  <text x="386" y="346" font-size="11" fill="#777">numel = 5 × 5 = 25 numbers.</text>
  <text x="386" y="368" font-size="11" fill="#777">stack 2 tickers → shape (2, 5, 5):</text>
  <text x="386" y="386" font-size="11" fill="#777">dim 0 = which ticker.</text>

  <text x="20" y="480" font-size="11" fill="#777">Shape is layout metadata: raw numbers + a schema that says how to read them.</text>
</svg>
