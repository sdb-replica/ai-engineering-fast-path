<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-label="The agentic loop: plan, act, observe, with a growing message history and three stop conditions">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a5cff"/>
    </marker>
  </defs>

  <!-- the loop -->
  <rect x="30" y="34" width="170" height="60" rx="10" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.5"/>
  <text x="115" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#0a54c2">PLAN</text>
  <text x="115" y="74" text-anchor="middle" font-size="10.5" fill="#333">planner reads history,</text>
  <text x="115" y="88" text-anchor="middle" font-size="10.5" fill="#333">picks ONE next move</text>

  <rect x="255" y="34" width="170" height="60" rx="10" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.5"/>
  <text x="340" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#0a54c2">ACT</text>
  <text x="340" y="74" text-anchor="middle" font-size="10.5" fill="#333">the tool runs for real</text>
  <text x="340" y="88" text-anchor="middle" font-size="10.5" fill="#333">(Day 60's round-trip)</text>

  <rect x="480" y="34" width="170" height="60" rx="10" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.5"/>
  <text x="565" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#0a54c2">OBSERVE</text>
  <text x="565" y="74" text-anchor="middle" font-size="10.5" fill="#333">the result comes back</text>
  <text x="565" y="88" text-anchor="middle" font-size="10.5" fill="#333">as a tool message</text>

  <line x1="202" y1="64" x2="251" y2="64" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="427" y1="64" x2="476" y2="64" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- observe -> history -->
  <path d="M565,94 L565,182 L454,182" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="498" y="140" text-anchor="middle" font-size="10.5" fill="#555">append call + result</text>

  <!-- history state -->
  <rect x="230" y="150" width="220" height="64" rx="10" fill="#fff8e6" stroke="#d99a00" stroke-width="1.5"/>
  <text x="340" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#9a6b00">HISTORY — the loop's only state</text>
  <text x="340" y="190" text-anchor="middle" font-size="10.5" fill="#333">task + every call + every result</text>
  <text x="340" y="206" text-anchor="middle" font-size="10.5" fill="#333">+2 messages per step · never shrinks</text>

  <!-- history -> plan (the loop-back) -->
  <path d="M230,182 L115,182 L115,98" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="124" y="132" font-size="10.5" fill="#555">planner re-reads</text>
  <text x="124" y="146" font-size="10.5" fill="#555">the whole history</text>

  <!-- history growth strip -->
  <text x="40" y="242" font-size="11" font-weight="700" fill="#333">The state grows every turn:</text>
  <rect x="40" y="284" width="36" height="16" fill="#0a7aff"/>
  <rect x="92" y="268" width="36" height="32" fill="#0a7aff"/>
  <rect x="144" y="252" width="36" height="48" fill="#0a7aff"/>
  <text x="58" y="278" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="110" y="262" text-anchor="middle" font-size="10.5" fill="#333">5</text>
  <text x="162" y="246" text-anchor="middle" font-size="10.5" fill="#333">7</text>
  <line x1="36" y1="300" x2="196" y2="300" stroke="#999" stroke-width="1"/>
  <text x="116" y="316" text-anchor="middle" font-size="10.5" fill="#777">messages after steps 1 · 2 · 3</text>

  <!-- stop-condition exits -->
  <path d="M340,214 L340,332" fill="none" stroke="#7a5cff" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrd)"/>
  <text x="350" y="266" font-size="10.5" fill="#5a3fd4">stop conditions</text>
  <text x="350" y="280" font-size="10.5" fill="#5a3fd4">checked every step</text>

  <rect x="30" y="336" width="200" height="50" rx="10" fill="#e9f9ee" stroke="#22a355" stroke-width="1.5"/>
  <text x="130" y="356" text-anchor="middle" font-size="11.5" font-weight="700" fill="#177245">✓ FINAL ANSWER</text>
  <text x="130" y="372" text-anchor="middle" font-size="10.5" fill="#333">planner answers, no call — done</text>

  <rect x="240" y="336" width="200" height="50" rx="10" fill="#fff8e6" stroke="#d99a00" stroke-width="1.5"/>
  <text x="340" y="356" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9a6b00">⏱ MAX STEPS</text>
  <text x="340" y="372" text-anchor="middle" font-size="10.5" fill="#333">step budget spent — kill it</text>

  <rect x="450" y="336" width="200" height="50" rx="10" fill="#fdecec" stroke="#d64545" stroke-width="1.5"/>
  <text x="550" y="356" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b03030">♻ REPEAT DETECTED</text>
  <text x="550" y="372" text-anchor="middle" font-size="10.5" fill="#333">same call + args twice — kill it</text>
</svg>
