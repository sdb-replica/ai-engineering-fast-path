<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif" role="img" aria-label="Computation tape for z = w*x + b: forward pass stamps grad_fn receipts; backward pass replays them right-to-left, filling gradients on the leaves">
      <defs>
        <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
          <path d="M0 0 L8 4.5 L0 9 z" fill="#1c1c1e"/>
        </marker>
        <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
          <path d="M0 0 L8 4.5 L0 9 z" fill="#22a355"/>
        </marker>
      </defs>

      <text x="20" y="28" font-size="14" font-weight="700" fill="currentColor">The tape for z = w·x + b</text>
      <text x="20" y="46" font-size="11" fill="#777">Dark arrows = forward (build the value, stamp receipts). Green dashed = backward (replay receipts, attribute the change).</text>

      <!-- LEAVES -->
      <rect x="20" y="170" width="140" height="64" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="2"/>
      <text x="90" y="194" font-size="12" font-weight="700" text-anchor="middle" fill="currentColor">x · leaf</text>
      <text x="90" y="212" font-size="11" text-anchor="middle" fill="currentColor">value 2.0 · requires_grad</text>
      <text x="90" y="256" font-size="11" font-weight="700" text-anchor="middle" fill="#22a355">→ x.grad = 3.0</text>

      <rect x="20" y="300" width="140" height="64" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="2"/>
      <text x="90" y="324" font-size="12" font-weight="700" text-anchor="middle" fill="currentColor">w · leaf</text>
      <text x="90" y="342" font-size="11" text-anchor="middle" fill="currentColor">value 3.0 · requires_grad</text>
      <text x="90" y="386" font-size="11" font-weight="700" text-anchor="middle" fill="#22a355">→ w.grad = 2.0</text>

      <!-- INTERMEDIATES -->
      <rect x="270" y="235" width="150" height="64" rx="8" fill="#f1efff" stroke="#7a5cff" stroke-width="2"/>
      <text x="345" y="259" font-size="12" font-weight="700" text-anchor="middle" fill="currentColor">y = w·x → 6.0</text>
      <text x="345" y="279" font-size="10.5" text-anchor="middle" fill="#5a3fd4">receipt: MulBackward0</text>

      <rect x="510" y="235" width="150" height="64" rx="8" fill="#f1efff" stroke="#7a5cff" stroke-width="2"/>
      <text x="585" y="259" font-size="12" font-weight="700" text-anchor="middle" fill="currentColor">z = y+b → 7.0</text>
      <text x="585" y="279" font-size="10.5" text-anchor="middle" fill="#5a3fd4">receipt: AddBackward0</text>
      <text x="585" y="222" font-size="11" font-weight="700" text-anchor="middle" fill="#22a355">seed: dz/dz = 1</text>

      <rect x="510" y="350" width="140" height="64" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="2"/>
      <text x="580" y="374" font-size="12" font-weight="700" text-anchor="middle" fill="currentColor">b · leaf</text>
      <text x="580" y="392" font-size="11" text-anchor="middle" fill="currentColor">value 1.0 · requires_grad</text>
      <text x="580" y="436" font-size="11" font-weight="700" text-anchor="middle" fill="#22a355">→ b.grad = 1.0</text>

      <!-- FORWARD arrows -->
      <path d="M160 200 Q 220 200 262 246" stroke="#1c1c1e" stroke-width="2" fill="none" marker-end="url(#arr)"/>
      <text x="212" y="212" font-size="16" font-weight="700" fill="currentColor">×</text>
      <path d="M160 334 Q 220 334 262 290" stroke="#1c1c1e" stroke-width="2" fill="none" marker-end="url(#arr)"/>
      <text x="212" y="330" font-size="16" font-weight="700" fill="currentColor">×</text>
      <line x1="420" y1="267" x2="502" y2="267" stroke="#1c1c1e" stroke-width="2" marker-end="url(#arr)"/>
      <text x="458" y="258" font-size="16" font-weight="700" fill="currentColor">+</text>
      <line x1="580" y1="350" x2="580" y2="307" stroke="#1c1c1e" stroke-width="2" marker-end="url(#arr)"/>
      <text x="590" y="332" font-size="16" font-weight="700" fill="currentColor">+</text>

      <!-- BACKWARD arrows -->
      <path d="M510 250 Q 465 226 428 250" stroke="#22a355" stroke-width="2" stroke-dasharray="5,4" fill="none" marker-end="url(#arrG)"/>
      <text x="465" y="240" font-size="10.5" font-weight="700" text-anchor="middle" fill="#177245">dz/dy = 1</text>
      <path d="M272 242 Q 175 145 163 178" stroke="#22a355" stroke-width="2" stroke-dasharray="5,4" fill="none" marker-end="url(#arrG)"/>
      <text x="172" y="168" font-size="10.5" font-weight="700" text-anchor="middle" fill="#177245">dz/dx = w = 3</text>
      <path d="M272 292 Q 175 372 163 358" stroke="#22a355" stroke-width="2" stroke-dasharray="5,4" fill="none" marker-end="url(#arrG)"/>
      <text x="172" y="382" font-size="10.5" font-weight="700" text-anchor="middle" fill="#177245">dz/dw = x = 2</text>
      <path d="M646 300 Q 664 326 649 348" stroke="#22a355" stroke-width="2" stroke-dasharray="5,4" fill="none" marker-end="url(#arrG)"/>
      <text x="620" y="330" font-size="10.5" font-weight="700" text-anchor="middle" fill="#177245">dz/db = 1</text>

      <!-- RECEIPTS strip -->
      <line x1="20" y1="462" x2="660" y2="462" stroke="#e0e0e0" stroke-width="1.5"/>
      <text x="20" y="484" font-size="12" font-weight="700" fill="currentColor">Each receipt is also the rule for going backward</text>
      <rect x="20" y="494" width="312" height="52" rx="8" fill="#f7f7f8" stroke="#ddd" stroke-width="1"/>
      <text x="34" y="514" font-size="11" font-weight="700" fill="currentColor">multiply → y = w·x</text>
      <text x="34" y="533" font-size="10.5" fill="currentColor">backward: dy/dx = w, dy/dw = x — scale by the other input</text>
      <rect x="348" y="494" width="312" height="52" rx="8" fill="#f7f7f8" stroke="#ddd" stroke-width="1"/>
      <text x="362" y="514" font-size="11" font-weight="700" fill="currentColor">add → z = y + b</text>
      <text x="362" y="533" font-size="10.5" fill="currentColor">backward: gradient passes straight through (dz/dy = 1, dz/db = 1)</text>
    </svg>