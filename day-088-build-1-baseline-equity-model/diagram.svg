<svg viewBox="0 0 680 396" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
<rect x="0" y="0" width="680" height="396" fill="#ffffff" stroke="none"/>
<text x="340" y="24" text-anchor="middle" font-size="13.5" fill="#1c1c1e" font-weight="bold">Build 1: the capstone equity pipeline, assembled in honesty order</text>
<text x="340" y="41" text-anchor="middle" font-size="9.5" fill="#666666">each box is an earlier day, reused unchanged - the model is deliberately the dumbest box in the row</text>
<rect x="12" y="56" width="196" height="58" rx="8" fill="#ffffff" stroke="#888888" stroke-width="1.2"/>
<text x="110.0" y="79" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">SYNTHETIC ACME</text>
<text x="110.0" y="95" text-anchor="middle" font-size="8.5" fill="#555555">2,016 days, stated process</text>
<text x="110.0" y="108" text-anchor="middle" font-size="8.5" fill="#888888">planted signal: kappa 0.10</text>
<rect x="242" y="56" width="196" height="58" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="340.0" y="79" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">FEATURES</text>
<text x="340.0" y="95" text-anchor="middle" font-size="8.5" fill="#555555">5 numbers from history</text>
<text x="340.0" y="108" text-anchor="middle" font-size="8.5" fill="#0a7aff">Day 85 (set from Day 32)</text>
<rect x="472" y="56" width="196" height="58" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="570.0" y="79" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">LABELS</text>
<text x="570.0" y="95" text-anchor="middle" font-size="8.5" fill="#555555">triple barrier, 10 days</text>
<text x="570.0" y="108" text-anchor="middle" font-size="8.5" fill="#0a7aff">Day 86</text>
<line x1="210" y1="85" x2="240" y2="85" stroke="#888888" stroke-width="1.6"/>
<polygon points="240,85 233,81 233,89" fill="#888888"/>
<line x1="440" y1="85" x2="470" y2="85" stroke="#0a7aff" stroke-width="1.6"/>
<polygon points="470,85 463,81 463,89" fill="#0a7aff"/>
<line x1="570" y1="116" x2="570" y2="140" stroke="#0a7aff" stroke-width="1.6"/>
<polygon points="570,140 566,133 574,133" fill="#0a7aff"/>
<rect x="472" y="142" width="196" height="58" rx="8" fill="#e9f9ee" stroke="#22a355" stroke-width="1.2"/>
<text x="570.0" y="165" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">WALK-FORWARD</text>
<text x="570.0" y="181" text-anchor="middle" font-size="8.5" fill="#555555">expanding folds + purge</text>
<text x="570.0" y="194" text-anchor="middle" font-size="8.5" fill="#22a355">Day 87</text>
<rect x="242" y="142" width="196" height="58" rx="8" fill="#e9f9ee" stroke="#22a355" stroke-width="1.2"/>
<text x="340.0" y="165" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">BASELINE MODEL</text>
<text x="340.0" y="181" text-anchor="middle" font-size="8.5" fill="#555555">logistic regression, 6 thetas</text>
<text x="340.0" y="194" text-anchor="middle" font-size="8.5" fill="#22a355">Day 88 - by hand</text>
<rect x="12" y="142" width="196" height="58" rx="8" fill="#fff8e6" stroke="#d99a00" stroke-width="1.2"/>
<text x="110.0" y="165" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">TRADE IT</text>
<text x="110.0" y="181" text-anchor="middle" font-size="8.5" fill="#555555">one position, barrier exits</text>
<text x="110.0" y="194" text-anchor="middle" font-size="8.5" fill="#d99a00">costs: 5 bps / side</text>
<line x1="470" y1="171" x2="440" y2="171" stroke="#22a355" stroke-width="1.6"/>
<polygon points="440,171 447,167 447,175" fill="#22a355"/>
<line x1="240" y1="171" x2="210" y2="171" stroke="#d99a00" stroke-width="1.6"/>
<polygon points="210,171 217,167 217,175" fill="#d99a00"/>
<line x1="110" y1="202" x2="110" y2="226" stroke="#d99a00" stroke-width="1.6"/>
<polygon points="110,226 106,219 114,219" fill="#d99a00"/>
<rect x="12" y="232" width="656" height="118" rx="8" fill="#ffffff" stroke="#d64545" stroke-width="1.2"/>
<text x="340" y="254" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">THE VERDICT THE PIPELINE REPORTS (real run, seed 88)</text>
<text x="340" y="276" text-anchor="middle" font-size="10" fill="#1c1c1e">pooled accuracy 0.5467  vs majority baseline 0.5247   ->   a real edge: +0.0220</text>
<text x="340" y="296" text-anchor="middle" font-size="10" fill="#1c1c1e">the 113 trades actually taken split 57 / 56  ->  the taken subset was a coin flip</text>
<text x="340" y="316" text-anchor="middle" font-size="10" fill="#1c1c1e">net Sharpe -0.16   |   zero-cost Sharpe -0.05   |   buy-and-hold Sharpe +0.37</text>
<text x="340" y="338" text-anchor="middle" font-size="9.5" fill="#d64545" font-weight="bold">accuracy is a property of rows. P&amp;L is a property of taken trades and costs.</text>
</svg>
