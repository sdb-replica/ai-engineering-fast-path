<svg viewBox="0 0 680 472" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
<rect x="0" y="0" width="680" height="472" fill="#ffffff"/>
<text x="340" y="24" text-anchor="middle" font-size="13.5" fill="#1c1c1e" font-weight="bold">Model registries: versions are files, stages are pointers</text>
<text x="340" y="41" text-anchor="middle" font-size="9.5" fill="#666666">direction-clf, three training runs - nothing below ever edits a version</text>
<rect x="12" y="56" width="656" height="172" rx="10" fill="#ffffff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="340" y="76" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">A - VERSIONS: one immutable file per training run</text>
<line x1="40" y1="132" x2="640" y2="132" stroke="#0a7aff" stroke-width="1.6"/>
<rect x="40" y="96" width="170" height="72" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="125" y="120" text-anchor="middle" font-size="11" fill="#1c1c1e" font-weight="bold">v1</text>
<text x="125" y="138" text-anchor="middle" font-size="8.5" fill="#555555">sha256 a40a6bc15452...</text>
<text x="125" y="156" text-anchor="middle" font-size="8.5" fill="#555555">run-101 - val_acc 0.912</text>
<rect x="255" y="96" width="170" height="72" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="340" y="120" text-anchor="middle" font-size="11" fill="#1c1c1e" font-weight="bold">v2</text>
<text x="340" y="138" text-anchor="middle" font-size="8.5" fill="#555555">sha256 bbf3581b655d...</text>
<text x="340" y="156" text-anchor="middle" font-size="8.5" fill="#555555">run-117 - val_acc 0.934</text>
<rect x="470" y="96" width="170" height="72" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="555" y="120" text-anchor="middle" font-size="11" fill="#1c1c1e" font-weight="bold">v3</text>
<text x="555" y="138" text-anchor="middle" font-size="8.5" fill="#555555">sha256 f9c8d608cc17...</text>
<text x="555" y="156" text-anchor="middle" font-size="8.5" fill="#555555">run-121 - val_acc 0.929</text>
<line x1="212" y1="132" x2="253" y2="132" stroke="#0a7aff" stroke-width="1.6"/>
<polygon points="253,132 246,128 246,136" fill="#0a7aff"/>
<line x1="427" y1="132" x2="468" y2="132" stroke="#0a7aff" stroke-width="1.6"/>
<polygon points="468,132 461,128 461,136" fill="#0a7aff"/>
<text x="340" y="192" text-anchor="middle" font-size="9" fill="#1c1c1e">A new version is a NEW file. Old versions are never edited, overwritten, or deleted.</text>
<text x="340" y="210" text-anchor="middle" font-size="9" fill="#1c1c1e">Re-registering identical bytes is refused as a duplicate - content, not the caller, decides identity.</text>
<rect x="12" y="232" width="656" height="170" rx="10" fill="#ffffff" stroke="#22a355" stroke-width="1.2"/>
<text x="340" y="252" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">B - STAGE TAGS: pointers that move over the versions</text>
<path d="M 335 300 C 335 268, 140 268, 140 300" fill="none" stroke="#d99a00" stroke-width="1.6" stroke-dasharray="6,4"/>
<polygon points="140,300 136,292 144,292" fill="#d99a00"/>
<text x="237" y="278" text-anchor="middle" font-size="9" fill="#9a6b00" font-weight="bold">rollback: move production back to v1</text>
<rect x="80" y="300" width="120" height="40" rx="8" fill="#e9f9ee" stroke="#22a355" stroke-width="1.2"/>
<text x="140" y="325" text-anchor="middle" font-size="11" fill="#1c1c1e" font-weight="bold">v1</text>
<rect x="275" y="300" width="120" height="40" rx="8" fill="#e9f9ee" stroke="#22a355" stroke-width="1.2"/>
<text x="335" y="325" text-anchor="middle" font-size="11" fill="#1c1c1e" font-weight="bold">v2</text>
<rect x="470" y="300" width="120" height="40" rx="8" fill="#e9f9ee" stroke="#22a355" stroke-width="1.2"/>
<text x="530" y="325" text-anchor="middle" font-size="11" fill="#1c1c1e" font-weight="bold">v3</text>
<rect x="60" y="356" width="160" height="30" rx="15" fill="#22a355"/>
<text x="140" y="375" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">production -&gt; v1</text>
<line x1="140" y1="356" x2="140" y2="342" stroke="#22a355" stroke-width="1.6"/>
<polygon points="140,342 136,349 144,349" fill="#22a355"/>
<rect x="450" y="356" width="160" height="30" rx="15" fill="#0a7aff"/>
<text x="530" y="375" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">staging -&gt; v3</text>
<line x1="530" y1="356" x2="530" y2="342" stroke="#0a7aff" stroke-width="1.6"/>
<polygon points="530,342 526,349 534,349" fill="#0a7aff"/>
<rect x="12" y="414" width="656" height="48" rx="10" fill="#fff8e6" stroke="#d99a00" stroke-width="1.2"/>
<text x="340" y="433" text-anchor="middle" font-size="9.5" fill="#1c1c1e" font-weight="bold">The rule: never mutate a version - promotion and rollback are pointer moves.</text>
<text x="340" y="451" text-anchor="middle" font-size="9.5" fill="#1c1c1e">Every load verifies sha256, so a flipped byte is a failed load, never a silent one.</text>
</svg>
