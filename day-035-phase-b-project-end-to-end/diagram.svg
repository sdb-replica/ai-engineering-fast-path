<svg viewBox="0 0 680 452" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
<rect x="0" y="0" width="680" height="452" rx="0" fill="#ffffff" stroke="none" stroke-width="1.0"/>
<text x="340" y="24" text-anchor="middle" font-size="13.5" fill="#1c1c1e" font-weight="bold">The Phase B project: one pipeline, six stages, contracts between them</text>
<text x="340" y="41" text-anchor="middle" font-size="9.5" fill="#666666">Day 32&#x27;s build, rebuilt as an artifact - one config in, one honest report card out</text>
<rect x="12" y="56" width="656" height="128" rx="10" fill="#ffffff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="340" y="76" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">STAGES 1-3 - DATA IN, WITH CONTRACTS (Days 9, 19, 32)</text>
<rect x="28" y="88" width="188" height="58" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="122" y="108" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">1 - DATA</text>
<text x="122" y="124" text-anchor="middle" font-size="8.5" fill="#555555">620 formula-built returns</text>
<text x="122" y="138" text-anchor="middle" font-size="8.5" fill="#555555">no downloads - Day 32</text>
<line x1="218" y1="117" x2="238" y2="117" stroke="#0a7aff" stroke-width="1.6"/>
<polygon points="238,117 231,113 231,121" fill="#0a7aff"/>
<rect x="240" y="88" width="188" height="58" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="334" y="108" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">2 - FEATURES</text>
<text x="334" y="124" text-anchor="middle" font-size="8.5" fill="#555555">5 per day, window ends at t</text>
<text x="334" y="138" text-anchor="middle" font-size="8.5" fill="#555555">label = sign of t+1 - no peek</text>
<line x1="430" y1="117" x2="450" y2="117" stroke="#0a7aff" stroke-width="1.6"/>
<polygon points="450,117 443,113 443,121" fill="#0a7aff"/>
<rect x="452" y="88" width="188" height="58" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="546" y="108" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">3 - SPLIT + SCALE</text>
<text x="546" y="124" text-anchor="middle" font-size="8.5" fill="#555555">360 / 120 / 120 chronological</text>
<text x="546" y="138" text-anchor="middle" font-size="8.5" fill="#555555">z-score: train stats only</text>
<text x="340" y="170" text-anchor="middle" font-size="9.0" fill="#1c1c1e">stage checks run here: shapes (600, 5) - splits sum to 600 - row 0&#x27;s label re-derived by hand</text>
<rect x="12" y="198" width="656" height="128" rx="10" fill="#ffffff" stroke="#22a355" stroke-width="1.2"/>
<text x="340" y="218" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">STAGES 4-5 - TRAIN BY RULE, SHIP AN ARTIFACT (Days 24, 25, 31)</text>
<rect x="28" y="230" width="292" height="58" rx="8" fill="#e9f9ee" stroke="#22a355" stroke-width="1.2"/>
<text x="174" y="250" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">4 - TRAIN + EARLY STOP</text>
<text x="174" y="266" text-anchor="middle" font-size="8.5" fill="#555555">Adam watches val every epoch; patience 25</text>
<text x="174" y="280" text-anchor="middle" font-size="8.5" fill="#555555">best snapshot kept - restored before test</text>
<line x1="322" y1="259" x2="342" y2="259" stroke="#22a355" stroke-width="1.6"/>
<polygon points="342,259 335,255 335,263" fill="#22a355"/>
<rect x="344" y="230" width="292" height="58" rx="8" fill="#e9f9ee" stroke="#22a355" stroke-width="1.2"/>
<text x="490" y="250" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">5 - SAVE THE ARTIFACT</text>
<text x="490" y="266" text-anchor="middle" font-size="8.5" fill="#555555">state_dict -&gt; day35_direction_mlp.pt</text>
<text x="490" y="280" text-anchor="middle" font-size="8.5" fill="#555555">reload into a fresh model: max diff 0.000000</text>
<text x="340" y="312" text-anchor="middle" font-size="9.0" fill="#177245">early stop fired at epoch 33 - the epoch-8 checkpoint (val acc 0.7333) is the one that shipped</text>
<rect x="12" y="340" width="656" height="96" rx="10" fill="#ffffff" stroke="#d99a00" stroke-width="1.2"/>
<text x="340" y="360" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">STAGE 6 - THE REPORT CARD (the deliverable)</text>
<rect x="28" y="370" width="612" height="30" rx="8" fill="#fff8e6" stroke="#d99a00" stroke-width="1.2"/>
<text x="334" y="389" text-anchor="middle" font-size="10.0" fill="#1c1c1e" font-weight="bold">test 0.6750  vs  majority 0.5000  vs  mom_5d rule 0.6833</text>
<text x="340" y="422" text-anchor="middle" font-size="9.0" fill="#1c1c1e">one seed (42) + one CONFIG: rerun the script, get this same card - that is reproducibility</text>
</svg>
