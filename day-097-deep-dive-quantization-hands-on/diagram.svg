<svg viewBox="0 0 680 492" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
<rect x="0" y="0" width="680" height="492" fill="#ffffff"/>
<text x="340" y="24" text-anchor="middle" font-size="13.5" fill="#1c1c1e" font-weight="bold">Quantization on real weights: two error reports</text>
<text x="340" y="41" text-anchor="middle" font-size="9.5" fill="#666666">same bits per weight in every bar - the only difference is where the grid spends its resolution</text>
<rect x="12" y="56" width="322" height="196" rx="8" fill="#ffffff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="173.0" y="76" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">A - WEIGHT ERROR: RMS error on W1</text>
<text x="120" y="105" text-anchor="end" font-size="9.5" fill="#1c1c1e">int8  per-tensor</text>
<rect x="128" y="92" width="9.6" height="17" rx="3" fill="#b0b0b0"/>
<text x="144.6" y="105" font-size="9.5" fill="#1c1c1e">0.0027</text>
<text x="120" y="139" text-anchor="end" font-size="9.5" fill="#1c1c1e">int8  per-channel</text>
<rect x="128" y="126" width="5.9" height="17" rx="3" fill="#22a355"/>
<text x="140.9" y="139" font-size="9.5" fill="#1c1c1e">0.0016</text>
<text x="120" y="173" text-anchor="end" font-size="9.5" fill="#1c1c1e">int4  per-tensor</text>
<rect x="128" y="160" width="178.0" height="17" rx="3" fill="#b0b0b0"/>
<text x="313.0" y="173" font-size="9.5" fill="#1c1c1e">0.0493</text>
<text x="120" y="207" text-anchor="end" font-size="9.5" fill="#1c1c1e">int4  per-channel</text>
<rect x="128" y="194" width="106.9" height="17" rx="3" fill="#22a355"/>
<text x="241.9" y="207" font-size="9.5" fill="#1c1c1e">0.0296</text>
<text x="173" y="240" text-anchor="middle" font-size="9.0" fill="#555555">per-channel cuts the TYPICAL weight's error ~40% at int4</text>
<rect x="346" y="56" width="322" height="196" rx="8" fill="#ffffff" stroke="#d99a00" stroke-width="1.2"/>
<text x="507.0" y="76" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">B - BEHAVIOR ERROR: mean |logit drift|</text>
<text x="454" y="105" text-anchor="end" font-size="9.5" fill="#1c1c1e">int8  per-tensor</text>
<rect x="462" y="92" width="11.7" height="17" rx="3" fill="#b0b0b0"/>
<text x="480.7" y="105" font-size="9.5" fill="#1c1c1e">0.0293</text>
<text x="462" y="121" font-size="8.5" fill="#666666">acc 0.9755 - 2 flips</text>
<text x="454" y="139" text-anchor="end" font-size="9.5" fill="#1c1c1e">int8  per-channel</text>
<rect x="462" y="126" width="6.8" height="17" rx="3" fill="#22a355"/>
<text x="475.8" y="139" font-size="9.5" fill="#1c1c1e">0.0170</text>
<text x="462" y="155" font-size="8.5" fill="#666666">acc 0.9750 - 1 flip</text>
<text x="454" y="173" text-anchor="end" font-size="9.5" fill="#1c1c1e">int4  per-tensor</text>
<rect x="462" y="160" width="158.0" height="17" rx="3" fill="#b0b0b0"/>
<text x="627.0" y="173" font-size="9.5" fill="#1c1c1e">0.3966</text>
<text x="462" y="189" font-size="8.5" fill="#666666">acc 0.9080 - 158 flips</text>
<text x="454" y="207" text-anchor="end" font-size="9.5" fill="#1c1c1e">int4  per-channel</text>
<rect x="462" y="194" width="116.5" height="17" rx="3" fill="#22a355"/>
<text x="585.5" y="207" font-size="9.5" fill="#1c1c1e">0.2924</text>
<text x="462" y="223" font-size="8.5" fill="#666666">acc 0.9710 - 37 flips</text>
<text x="507" y="240" text-anchor="middle" font-size="9.0" fill="#555555">weight error is mark-to-model - this panel is mark-to-market</text>
<rect x="12" y="266" width="656" height="164" rx="8" fill="#ffffff" stroke="#22a355" stroke-width="1.2"/>
<text x="340.0" y="286" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">C - WHY IT WORKS: every row its own int4 scale (first 8 rows of W1)</text>
<text x="142" y="309.0" text-anchor="end" font-size="9.0" fill="#1c1c1e">row 0</text>
<rect x="150" y="300.0" width="184.8" height="9" rx="2" fill="#22a355"/>
<text x="340.8" y="309.0" font-size="8.5" fill="#177245">0.0840</text>
<text x="142" y="323.5" text-anchor="end" font-size="9.0" fill="#1c1c1e">row 1</text>
<rect x="150" y="314.5" width="291.3" height="9" rx="2" fill="#22a355"/>
<text x="447.3" y="323.5" font-size="8.5" fill="#177245">0.1324</text>
<text x="142" y="338.0" text-anchor="end" font-size="9.0" fill="#1c1c1e">row 2</text>
<rect x="150" y="329.0" width="284.2" height="9" rx="2" fill="#22a355"/>
<text x="440.2" y="338.0" font-size="8.5" fill="#177245">0.1292</text>
<text x="142" y="352.5" text-anchor="end" font-size="9.0" fill="#1c1c1e">row 3</text>
<rect x="150" y="343.5" width="168.1" height="9" rx="2" fill="#22a355"/>
<text x="324.1" y="352.5" font-size="8.5" fill="#177245">0.0764</text>
<text x="142" y="367.0" text-anchor="end" font-size="9.0" fill="#1c1c1e">row 4</text>
<rect x="150" y="358.0" width="163.2" height="9" rx="2" fill="#22a355"/>
<text x="319.2" y="367.0" font-size="8.5" fill="#177245">0.0742</text>
<text x="142" y="381.5" text-anchor="end" font-size="9.0" fill="#1c1c1e">row 5</text>
<rect x="150" y="372.5" width="194.3" height="9" rx="2" fill="#22a355"/>
<text x="350.3" y="381.5" font-size="8.5" fill="#177245">0.0883</text>
<text x="142" y="396.0" text-anchor="end" font-size="9.0" fill="#1c1c1e">row 6</text>
<rect x="150" y="387.0" width="265.8" height="9" rx="2" fill="#22a355"/>
<text x="421.8" y="396.0" font-size="8.5" fill="#177245">0.1208</text>
<text x="142" y="410.5" text-anchor="end" font-size="9.0" fill="#1c1c1e">row 7</text>
<rect x="150" y="401.5" width="306.5" height="9" rx="2" fill="#22a355"/>
<text x="462.5" y="410.5" font-size="8.5" fill="#177245">0.1393</text>
<line x1="515.6" y1="296" x2="515.6" y2="416" stroke="#d43a2f" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="523.6" y="312" font-size="9.0" fill="#d43a2f" font-weight="bold">one shared per-tensor</text>
<text x="523.6" y="326" font-size="9.0" fill="#d43a2f" font-weight="bold">scale: 0.1662</text>
<text x="523.6" y="344" font-size="8.5" fill="#666666">every row's own scale is finer -</text>
<text x="523.6" y="357" font-size="8.5" fill="#666666">small rows stop paying for the</text>
<text x="523.6" y="370" font-size="8.5" fill="#666666">biggest row's range</text>
<text x="340" y="452" text-anchor="middle" font-size="9.5" fill="#1c1c1e">int4, per-tensor to per-channel: weight RMS 0.0493 to 0.0296 - logit drift 0.3966 to 0.2924 - accuracy 0.9080 to 0.9710</text>
<text x="340" y="470" text-anchor="middle" font-size="9.5" fill="#177245" font-weight="bold">the bits never changed - the grid did</text>
</svg>
