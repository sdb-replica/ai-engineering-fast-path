<text x="40" y="78" font-size="10.5" fill="#1c1c1e" font-weight="bold">YOUR DAY 42 GPT  -  the campfire</text>
<text x="40" y="93" font-size="8.5" fill="#555555">814,643 params  |  2.46M tokens processed (2,357 chars x 1,043 epochs)</text>
