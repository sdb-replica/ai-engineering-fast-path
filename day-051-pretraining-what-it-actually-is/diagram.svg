<text x="624.9" y="245" text-anchor="end" font-size="9.5" fill="#1c1c1e" font-weight="bold">C = 7.2e+23 FLOPs</text>
<rect x="12" y="330" width="656" height="62" rx="10" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="340.0" y="354" text-anchor="middle" font-size="11" fill="#1c1c1e" font-weight="bold">C ~ 6 x N x D   -   the only formula tonight</text>
<text x="340.0" y="372" text-anchor="middle" font-size="9.0" fill="#1c1c1e">forward ~2 FLOPs per param per token (Day 12) + backward ~4 (Day 23) = 6. Same loop at every rung - only N and D move.</text>
<text x="340.0" y="386" text-anchor="middle" font-size="9.0" fill="#0a54c2">campfire to power grid: 7.49e+06 x to GPT-2, 5.99e+10 x to a frontier-class run - same physics</text>
<rect x="12" y="404" width="656" height="84" rx="10" fill="#ffffff" stroke="#22a355" stroke-width="1.2"/>
<text x="340.0" y="424" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">WHERE THE COMPUTE GOES: PRETRAINING vs EVERYTHING AFTER (Days 52-56)</text>
<rect x="40" y="434" width="598" height="18" rx="4" fill="#e9f9ee" stroke="#22a355" stroke-width="1.2"/>
<rect x="636" y="434" width="2" height="18" fill="#d99a00" stroke="none"/>
<text x="52" y="447" font-size="9.5" fill="#1c1c1e" font-weight="bold">pretraining: 99.9993% of total compute</text>
<text x="340.0" y="470" text-anchor="middle" font-size="9.0" fill="#1c1c1e">fine-tuning the same 8B on 100M tokens = 1/150,000 of pretraining - the 2px sliver at the right edge</text>
<text x="340.0" y="482" text-anchor="middle" font-size="9.0" fill="#177245">pretraining buys the capability; everything after just steers it</text>
<text x="340.0" y="512" text-anchor="middle" font-size="8.5" fill="#888888">Model figures are reported / approximate: GPT-2 ~10B WebText tokens (commonly cited); Llama-3-class 15T tokens (Meta, reported).</text>
<text x="340.0" y="526" text-anchor="middle" font-size="8.5" fill="#888888">GPU time at the stated assumption (one H100, 3.0e14 FLOP/s sustained): GPT-2 XL 3.47 GPU-days - Llama-3-class 27,778 GPU-days.</text>
