<text x="596.0" y="354" text-anchor="middle" font-size="9.5" fill="#555555">64</text>
<text x="340.0" y="372" text-anchor="middle" font-size="10" fill="#1c1c1e">batch size - sequences sharing each decode step (log scale)</text>
<text x="150" y="150" font-size="10" fill="#0a54c2">throughput climbs,</text>
<text x="150" y="165" font-size="10" fill="#0a54c2">then flattens (ceiling 1333)</text>
<text x="372" y="246" font-size="10" fill="#c2510a">TPOT worsens linearly:</text>
<text x="372" y="261" font-size="10" fill="#c2510a">every rider pays the whole step</text>
