<text x="480" y="398" font-size="10" fill="#1c1c1e">latency SLO line</text>
<rect x="12" y="412" width="656" height="36" rx="10" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="340.0" y="434" text-anchor="middle" font-size="9.5" fill="#1c1c1e">Little&#x27;s law: concurrency = throughput x latency - 5.988 req/s x 8.016 s = 48 in flight. Pick two; the third is arithmetic.</text>
