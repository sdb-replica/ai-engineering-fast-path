<text x="340.0" y="24" text-anchor="middle" font-size="13.5" fill="#1c1c1e" font-weight="bold">The serving tradeoff: batch buys throughput with latency</text>
<text x="340.0" y="41" text-anchor="middle" font-size="9.5" fill="#666666">step_ms(B) = 4.0 + 0.75 x B - one model, both curves, no magic numbers</text>
<text x="330.0" y="66" text-anchor="middle" font-size="11" fill="#1c1c1e" font-weight="bold">OPERATING POINT: batch 48</text>
<text x="330.0" y="81" text-anchor="middle" font-size="9.5" fill="#555555">1200 tok/s at TPOT exactly 40 ms - the largest batch the SLO allows</text>
