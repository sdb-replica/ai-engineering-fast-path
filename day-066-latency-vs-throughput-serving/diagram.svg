<text x="18" y="210" text-anchor="middle" font-size="10" fill="#0a54c2" font-weight="bold" transform="rotate(-90 18 210)">tokens / sec per GPU</text>
<text x="662" y="210" text-anchor="middle" font-size="10" fill="#c2510a" font-weight="bold" transform="rotate(90 662 210)">TPOT ms / token</text>
