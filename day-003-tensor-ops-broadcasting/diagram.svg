<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 648" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif" role="img" aria-label="Broadcasting: a scalar and a vector stretching across a matrix, plus the two broadcasting rules">
      <text x="20" y="28" font-size="14" font-weight="700" fill="currentColor">Broadcasting: small shapes stretch to match big ones</text>
      <text x="20" y="44" font-size="11" fill="#777">Same shape → cell-by-cell: C[i,j] = A[i,j] + B[i,j]. Smaller shape → it stretches. The loop lives in C/MPS, never in Python.</text>

      <line x1="332" y1="56" x2="332" y2="470" stroke="#e0e0e0" stroke-width="1.5"/>

      <!-- LEFT: scalar broadcast -->
      <text x="24" y="68" font-size="12" font-weight="700" fill="currentColor">scalar broadcast — one number, every cell</text>
      <rect x="60" y="78" width="110" height="34" rx="8" fill="#fff8e6" stroke="#d99a00" stroke-width="2"/>
      <text x="115" y="100" font-size="14" font-weight="700" text-anchor="middle" fill="#9a6b00">k = 2.0</text>
      <g stroke="#d99a00" stroke-width="1.5" stroke-dasharray="4,3" fill="none">
        <path d="M 80 114 Q 66 132 65 148"/>
        <path d="M 115 114 Q 115 132 121 148"/>
        <path d="M 150 114 Q 165 132 177 148"/>
        <path d="M 180 114 Q 208 132 233 148"/>
      </g>
      <g fill="#eef4ff" stroke="#0a7aff" stroke-width="1.5">
        <rect x="40" y="150" width="50" height="34"/><rect x="96" y="150" width="50" height="34"/><rect x="152" y="150" width="50" height="34"/><rect x="208" y="150" width="50" height="34"/>
        <rect x="40" y="190" width="50" height="34"/><rect x="96" y="190" width="50" height="34"/><rect x="152" y="190" width="50" height="34"/><rect x="208" y="190" width="50" height="34"/>
        <rect x="40" y="230" width="50" height="34"/><rect x="96" y="230" width="50" height="34"/><rect x="152" y="230" width="50" height="34"/><rect x="208" y="230" width="50" height="34"/>
      </g>
      <text x="266" y="214" font-size="11" font-weight="700" fill="currentColor">A (3, 4)</text>
      <text x="149" y="292" font-size="22" font-weight="700" text-anchor="middle" fill="#d99a00">+</text>
      <g fill="#fff8e6" stroke="#d99a00" stroke-width="1.5">
        <rect x="40" y="306" width="50" height="34"/><rect x="96" y="306" width="50" height="34"/><rect x="152" y="306" width="50" height="34"/><rect x="208" y="306" width="50" height="34"/>
        <rect x="40" y="346" width="50" height="34"/><rect x="96" y="346" width="50" height="34"/><rect x="152" y="346" width="50" height="34"/><rect x="208" y="346" width="50" height="34"/>
        <rect x="40" y="386" width="50" height="34"/><rect x="96" y="386" width="50" height="34"/><rect x="152" y="386" width="50" height="34"/><rect x="208" y="386" width="50" height="34"/>
      </g>
      <text x="149" y="442" font-size="12" font-weight="700" text-anchor="middle" fill="currentColor">A + k → (3, 4)</text>
      <text x="149" y="458" font-size="10" text-anchor="middle" fill="#777">result[i,j] = A[i,j] + k — k stretches, never copied</text>

      <!-- RIGHT: vector broadcast -->
      <text x="344" y="68" font-size="12" font-weight="700" fill="currentColor">vector broadcast — one value per column</text>
      <rect x="380" y="78" width="50" height="34" fill="#dbeafe" stroke="#0a7aff" stroke-width="1.5"/>
      <rect x="436" y="78" width="50" height="34" fill="#dcfce7" stroke="#22a355" stroke-width="1.5"/>
      <rect x="492" y="78" width="50" height="34" fill="#fef3c7" stroke="#d99a00" stroke-width="1.5"/>
      <rect x="548" y="78" width="50" height="34" fill="#ede9fe" stroke="#7a5cff" stroke-width="1.5"/>
      <text x="405" y="100" font-size="11" font-weight="700" text-anchor="middle" fill="#0a54c2">v0</text>
      <text x="461" y="100" font-size="11" font-weight="700" text-anchor="middle" fill="#177245">v1</text>
      <text x="517" y="100" font-size="11" font-weight="700" text-anchor="middle" fill="#9a6b00">v2</text>
      <text x="573" y="100" font-size="11" font-weight="700" text-anchor="middle" fill="#5a3fd4">v3</text>
      <text x="606" y="100" font-size="11" font-weight="700" fill="currentColor">v (4,)</text>
      <g stroke-width="1.5" stroke-dasharray="4,3" fill="none">
        <path d="M 405 116 Q 400 132 395 148" stroke="#0a7aff"/>
        <path d="M 461 116 Q 456 132 451 148" stroke="#22a355"/>
        <path d="M 517 116 Q 512 132 507 148" stroke="#d99a00"/>
        <path d="M 573 116 Q 568 132 563 148" stroke="#7a5cff"/>
      </g>
      <rect x="370" y="150" width="50" height="34" fill="#dbeafe" stroke="#0a7aff" stroke-width="1.5"/>
      <rect x="426" y="150" width="50" height="34" fill="#dcfce7" stroke="#22a355" stroke-width="1.5"/>
      <rect x="482" y="150" width="50" height="34" fill="#fef3c7" stroke="#d99a00" stroke-width="1.5"/>
      <rect x="538" y="150" width="50" height="34" fill="#ede9fe" stroke="#7a5cff" stroke-width="1.5"/>
      <rect x="370" y="190" width="50" height="34" fill="#dbeafe" stroke="#0a7aff" stroke-width="1.5"/>
      <rect x="426" y="190" width="50" height="34" fill="#dcfce7" stroke="#22a355" stroke-width="1.5"/>
      <rect x="482" y="190" width="50" height="34" fill="#fef3c7" stroke="#d99a00" stroke-width="1.5"/>
      <rect x="538" y="190" width="50" height="34" fill="#ede9fe" stroke="#7a5cff" stroke-width="1.5"/>
      <rect x="370" y="230" width="50" height="34" fill="#dbeafe" stroke="#0a7aff" stroke-width="1.5"/>
      <rect x="426" y="230" width="50" height="34" fill="#dcfce7" stroke="#22a355" stroke-width="1.5"/>
      <rect x="482" y="230" width="50" height="34" fill="#fef3c7" stroke="#d99a00" stroke-width="1.5"/>
      <rect x="538" y="230" width="50" height="34" fill="#ede9fe" stroke="#7a5cff" stroke-width="1.5"/>
      <text x="596" y="214" font-size="11" font-weight="700" fill="currentColor">M (3, 4)</text>
      <text x="479" y="292" font-size="22" font-weight="700" text-anchor="middle" fill="#7a5cff">−</text>
      <rect x="370" y="306" width="50" height="34" fill="#dbeafe" stroke="#0a7aff" stroke-width="1.5"/>
      <rect x="426" y="306" width="50" height="34" fill="#dcfce7" stroke="#22a355" stroke-width="1.5"/>
      <rect x="482" y="306" width="50" height="34" fill="#fef3c7" stroke="#d99a00" stroke-width="1.5"/>
      <rect x="538" y="306" width="50" height="34" fill="#ede9fe" stroke="#7a5cff" stroke-width="1.5"/>
      <rect x="370" y="346" width="50" height="34" fill="#dbeafe" stroke="#0a7aff" stroke-width="1.5"/>
      <rect x="426" y="346" width="50" height="34" fill="#dcfce7" stroke="#22a355" stroke-width="1.5"/>
      <rect x="482" y="346" width="50" height="34" fill="#fef3c7" stroke="#d99a00" stroke-width="1.5"/>
      <rect x="538" y="346" width="50" height="34" fill="#ede9fe" stroke="#7a5cff" stroke-width="1.5"/>
      <rect x="370" y="386" width="50" height="34" fill="#dbeafe" stroke="#0a7aff" stroke-width="1.5"/>
      <rect x="426" y="386" width="50" height="34" fill="#dcfce7" stroke="#22a355" stroke-width="1.5"/>
      <rect x="482" y="386" width="50" height="34" fill="#fef3c7" stroke="#d99a00" stroke-width="1.5"/>
      <rect x="538" y="386" width="50" height="34" fill="#ede9fe" stroke="#7a5cff" stroke-width="1.5"/>
      <text x="479" y="442" font-size="12" font-weight="700" text-anchor="middle" fill="currentColor">M − v → (3, 4)</text>
      <text x="479" y="458" font-size="10" text-anchor="middle" fill="#777">result[i,j] = M[i,j] − v[j] — one value per column</text>

      <!-- BOTTOM: the two rules -->
      <line x1="20" y1="486" x2="660" y2="486" stroke="#e0e0e0" stroke-width="1.5"/>
      <text x="20" y="510" font-size="13" font-weight="700" fill="currentColor">The two rules</text>
      <text x="20" y="532" font-size="11" fill="currentColor">1 · Right-align the shapes — a missing leading dim counts as 1.</text>
      <rect x="40" y="542" width="36" height="26" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.5"/>
      <text x="58" y="560" font-size="11" font-weight="700" text-anchor="middle" fill="#0a54c2">3</text>
      <rect x="82" y="542" width="36" height="26" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.5"/>
      <text x="100" y="560" font-size="11" font-weight="700" text-anchor="middle" fill="#0a54c2">4</text>
      <rect x="82" y="574" width="36" height="26" fill="#fff8e6" stroke="#d99a00" stroke-width="1.5"/>
      <text x="100" y="592" font-size="11" font-weight="700" text-anchor="middle" fill="#9a6b00">4</text>
      <line x1="100" y1="569" x2="100" y2="573" stroke="#0a7aff" stroke-width="1.5" stroke-dasharray="3,2"/>
      <text x="136" y="594" font-size="11" fill="currentColor">(4,) slides under the 4 ✓</text>
      <text x="20" y="620" font-size="11" fill="currentColor">2 · Every dim must match or be 1 — a 1 stretches for free, anything else errors.</text>
      <text x="20" y="638" font-size="11" fill="currentColor">(3, 4) + (4,) → (3, 4) ✓   (3, 4) + (3, 1) → (3, 4) ✓   (3, 4) + (2,) → error ✗</text>
    </svg>
