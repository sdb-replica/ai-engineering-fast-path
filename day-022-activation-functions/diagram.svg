<text x="352.0" y="338.7" fill="#5a3fd4" font-weight="bold">tanh′ peaks at 1.0</text>
<text x="472.0" y="364.7" fill="#177245" font-weight="bold">ReLU′ = 1 for z &gt; 0</text>
<text x="361.0" y="443.2" fill="#0a54c2" font-weight="bold">sigmoid′ never tops 0.25</text>
<text x="88.0" y="399.6" fill="#555">in the tails every derivative → 0:</text>
<text x="88.0" y="415.6" fill="#555">a saturated neuron passes ~no gradient</text>
<rect x="40" y="522" width="194" height="84" rx="8" fill="#fafafa" stroke="#0a7aff"/>
<text x="137" y="544" text-anchor="middle" font-weight="bold" fill="#1c1c1e">sigmoid</text>
<text x="137" y="564" text-anchor="middle" fill="#555">out (0, 1) — reads as a</text>
<text x="137" y="579" text-anchor="middle" fill="#555">probability. Grad ≤ 0.25:</text>
<text x="137" y="594" text-anchor="middle" fill="#555">taxed at every layer.</text>
<rect x="243" y="522" width="194" height="84" rx="8" fill="#fafafa" stroke="#7a5cff"/>
<text x="340" y="544" text-anchor="middle" font-weight="bold" fill="#1c1c1e">tanh</text>
<text x="340" y="564" text-anchor="middle" fill="#555">out (−1, 1), zero-centered.</text>
<text x="340" y="579" text-anchor="middle" fill="#555">Grad ≤ 1, but tails still</text>
<text x="340" y="594" text-anchor="middle" fill="#555">saturate to ~0.</text>
<rect x="446" y="522" width="194" height="84" rx="8" fill="#fafafa" stroke="#22a355"/>
<text x="543" y="544" text-anchor="middle" font-weight="bold" fill="#1c1c1e">ReLU</text>
<text x="543" y="564" text-anchor="middle" fill="#555">out [0, ∞). Grad 1 when on,</text>
<text x="543" y="579" text-anchor="middle" fill="#555">0 when off — a neuron off</text>
<text x="543" y="594" text-anchor="middle" fill="#555">for all data can die.</text>
</svg>
