<svg viewBox="0 0 680 312" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
<rect x="0" y="0" width="680" height="312" rx="0" fill="#ffffff" stroke="none" stroke-width="1.0"/>
<text x="340.0" y="24" text-anchor="middle" font-size="13.5" fill="#1c1c1e" font-weight="bold">One budget, three splits: sign / exponent (range) / mantissa (precision)</text>
<text x="340.0" y="41" text-anchor="middle" font-size="9.5" fill="#666666">drawn to scale: one square = one bit; dashed outline = the full 32-bit width</text>
<rect x="110" y="54" width="11" height="11" fill="#6b7280"/>
<text x="126" y="63" font-size="9.5" fill="#1c1c1e">sign (1 bit, every format)</text>
<rect x="330" y="54" width="11" height="11" fill="#0a7aff"/>
<text x="346" y="63" font-size="9.5" fill="#1c1c1e">exponent = RANGE</text>
<rect x="492" y="54" width="11" height="11" fill="#22a355"/>
<text x="508" y="63" font-size="9.5" fill="#1c1c1e">mantissa = PRECISION</text>
<text x="100" y="102" text-anchor="end" font-size="11.5" fill="#1c1c1e" font-weight="bold">fp32</text>
<rect x="110" y="82" width="16" height="30" fill="#6b7280"/>
<rect x="126" y="82" width="128" height="30" fill="#0a7aff"/>
<rect x="254" y="82" width="368" height="30" fill="#22a355"/>
<text x="118" y="101" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">1</text>
<text x="190" y="101" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">8</text>
<text x="438" y="101" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">23</text>
<text x="110" y="128" font-size="9" fill="#555555">range &#8776; 1.2e-38 &#8230; 3.4e38 &#183; step at 1.0 = 2^-23 &#183; the reference: 4 bytes per parameter</text>
<text x="100" y="172" text-anchor="end" font-size="11.5" fill="#1c1c1e" font-weight="bold">fp16</text>
<rect x="110" y="152" width="512" height="30" fill="none" stroke="#bbbbbb" stroke-width="1.0" stroke-dasharray="4 3"/>
<rect x="110" y="152" width="16" height="30" fill="#6b7280"/>
<rect x="126" y="152" width="80" height="30" fill="#0a7aff"/>
<rect x="206" y="152" width="160" height="30" fill="#22a355"/>
<text x="118" y="171" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">1</text>
<text x="166" y="171" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">5</text>
<text x="286" y="171" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">10</text>
<text x="110" y="198" font-size="9" fill="#555555">range &#8776; 6.1e-05 &#8230; 65504 &#183; step at 1.0 = 2^-10 &#183; fine steps, tiny range &#8594; gradients underflow</text>
<text x="100" y="242" text-anchor="end" font-size="11.5" fill="#1c1c1e" font-weight="bold">bf16</text>
<rect x="110" y="222" width="512" height="30" fill="none" stroke="#bbbbbb" stroke-width="1.0" stroke-dasharray="4 3"/>
<rect x="110" y="222" width="16" height="30" fill="#6b7280"/>
<rect x="126" y="222" width="128" height="30" fill="#0a7aff"/>
<rect x="254" y="222" width="112" height="30" fill="#22a355"/>
<text x="118" y="241" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">1</text>
<text x="190" y="241" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">8</text>
<text x="310" y="241" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">7</text>
<text x="110" y="268" font-size="9" fill="#555555">range &#8776; 1.2e-38 &#8230; 3.4e38 (fp32&#8217;s range) &#183; step at 1.0 = 2^-7 &#183; coarse steps, nothing underflows</text>
<text x="340.0" y="296" text-anchor="middle" font-size="9.5" fill="#0a54c2" font-weight="bold">Same 16 bits, two philosophies: fp16 buys precision, bf16 buys range &#8212; training chose range, plus an fp32 master</text>
</svg>
