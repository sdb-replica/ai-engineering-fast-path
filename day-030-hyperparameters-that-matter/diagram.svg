<svg viewBox="0 0 680 466" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
<rect x="0" y="0" width="680" height="466" fill="#ffffff"/>
<text x="340" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c1c1e">Three dials, three different jobs</text>
<text x="340" y="42" text-anchor="middle" font-size="10" fill="#666666">Turn them in order:  1) learning rate   2) batch size   3) capacity (depth vs width)</text>
<rect x="12" y="54" width="656.0" height="118" rx="10" fill="#f7f9ff" stroke="#0a7aff" stroke-width="1"/>
<text x="340" y="76" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0a54c2">DIAL 1 - LEARNING RATE: the stride of every step</text>
<rect x="24" y="88" width="200.0" height="70" rx="6" fill="#fff3d6" stroke="#bbbbbb" stroke-width="1"/>
<text x="124" y="109" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1c1c1e">lr 0.01 - TOO SMALL</text>
<text x="124" y="129" text-anchor="middle" font-size="9.0" fill="#333333">loss after 30 epochs: 1.6600</text>
<text x="124" y="147" text-anchor="middle" font-size="9.0" fill="#666666">still crawling toward the line</text>
<rect x="236" y="88" width="200.0" height="70" rx="6" fill="#e9f9ee" stroke="#bbbbbb" stroke-width="1"/>
<text x="336" y="109" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1c1c1e">lr 0.05-0.20 - SWEET SPOT</text>
<text x="336" y="129" text-anchor="middle" font-size="9.0" fill="#333333">loss after 30 epochs: 0.0020 / 0.0000</text>
<text x="336" y="147" text-anchor="middle" font-size="9.0" fill="#666666">arrives - lr 0.20 lands w = 2.5000</text>
<rect x="448" y="88" width="200.0" height="70" rx="6" fill="#fdecec" stroke="#bbbbbb" stroke-width="1"/>
<text x="548" y="109" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1c1c1e">lr 0.65 - TOO BIG</text>
<text x="548" y="129" text-anchor="middle" font-size="9.0" fill="#333333">loss at epoch 10: 227.3 (was 11.4)</text>
<text x="548" y="147" text-anchor="middle" font-size="9.0" fill="#666666">overshoots, then diverges</text>
<rect x="12" y="184" width="656.0" height="128" rx="10" fill="#fffaf0" stroke="#d97706" stroke-width="1"/>
<text x="320" y="206" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#9a6b00">DIAL 2 - BATCH SIZE: noise falls, steps per epoch fall with it</text>
<text x="30" y="228" text-anchor="start" font-size="9.0" fill="#333333">batch  1 - 32 steps</text>
<rect x="168" y="218" width="230.0" height="10" rx="3" fill="#d97706" stroke="#d97706" stroke-width="1"/>
<text x="412.0" y="228" text-anchor="start" font-size="9.0" fill="#333333">noise 6.2172</text>
<text x="30" y="243" text-anchor="start" font-size="9.0" fill="#333333">batch  2 - 16 steps</text>
<rect x="168" y="233" width="72.9" height="10" rx="3" fill="#d97706" stroke="#d97706" stroke-width="1"/>
<text x="254.885865019623" y="243" text-anchor="start" font-size="9.0" fill="#333333">noise 1.9702</text>
<text x="30" y="258" text-anchor="start" font-size="9.0" fill="#333333">batch  4 -  8 steps</text>
<rect x="168" y="248" width="42.5" height="10" rx="3" fill="#d97706" stroke="#d97706" stroke-width="1"/>
<text x="224.45818053142892" y="258" text-anchor="start" font-size="9.0" fill="#333333">noise 1.1477</text>
<text x="30" y="273" text-anchor="start" font-size="9.0" fill="#333333">batch  8 -  4 steps</text>
<rect x="168" y="263" width="32.6" height="10" rx="3" fill="#d97706" stroke="#d97706" stroke-width="1"/>
<text x="214.55854725599949" y="273" text-anchor="start" font-size="9.0" fill="#333333">noise 0.8801</text>
<text x="30" y="288" text-anchor="start" font-size="9.0" fill="#333333">batch 16 -  2 steps</text>
<rect x="168" y="278" width="24.8" height="10" rx="3" fill="#d97706" stroke="#d97706" stroke-width="1"/>
<text x="206.78607733384803" y="288" text-anchor="start" font-size="9.0" fill="#333333">noise 0.6700</text>
<text x="30" y="303" text-anchor="start" font-size="9.0" fill="#333333">batch 32 -  1 steps</text>
<text x="182.0" y="303" text-anchor="start" font-size="9.0" fill="#333333">noise 0.0000</text>
<text x="560" y="232" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#9a6b00">a batch is a SAMPLE</text>
<text x="560" y="252" text-anchor="middle" font-size="9.0" fill="#333333">small: noisy, many steps</text>
<text x="560" y="270" text-anchor="middle" font-size="9.0" fill="#333333">large: smooth, few steps</text>
<text x="560" y="288" text-anchor="middle" font-size="9.0" fill="#333333">batch 32 = all the data here,</text>
<text x="560" y="302" text-anchor="middle" font-size="9.0" fill="#333333">so its noise is exactly 0</text>
<rect x="12" y="324" width="656.0" height="130" rx="10" fill="#f7f7f8" stroke="#cccccc" stroke-width="1"/>
<text x="340" y="346" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1c1c1e">DIAL 3 - CAPACITY: params counted by PyTorch (bar length ~ square root of params)</text>
<text x="30" y="368" text-anchor="start" font-size="9.5" font-weight="bold" fill="#0a54c2">WIDTH - 10->h->h->1 (doubling h)</text>
<text x="30" y="390" text-anchor="start" font-size="9.0" fill="#333333">h= 8</text>
<rect x="82" y="380" width="19.3" height="10" rx="3" fill="#0a7aff" stroke="#0a7aff" stroke-width="1"/>
<text x="107.25738364663735" y="390" text-anchor="start" font-size="9.0" fill="#333333">169 params</text>
<text x="30" y="405" text-anchor="start" font-size="9.0" fill="#333333">h=16</text>
<rect x="82" y="395" width="31.9" height="10" rx="3" fill="#0a7aff" stroke="#0a7aff" stroke-width="1"/>
<text x="119.94334607536545" y="405" text-anchor="start" font-size="9.0" fill="#333333">465 params</text>
<text x="30" y="420" text-anchor="start" font-size="9.0" fill="#333333">h=32</text>
<rect x="82" y="410" width="56.2" height="10" rx="3" fill="#0a7aff" stroke="#0a7aff" stroke-width="1"/>
<text x="144.23230949699104" y="420" text-anchor="start" font-size="9.0" fill="#333333">1441 params</text>
<text x="30" y="435" text-anchor="start" font-size="9.0" fill="#333333">h=64</text>
<rect x="82" y="425" width="104.0" height="10" rx="3" fill="#0a7aff" stroke="#0a7aff" stroke-width="1"/>
<text x="192.0" y="435" text-anchor="start" font-size="9.0" fill="#333333">4929 params</text>
<text x="366" y="368" text-anchor="start" font-size="9.5" font-weight="bold" fill="#177245">DEPTH - width 16, L hidden layers</text>
<text x="366" y="390" text-anchor="start" font-size="9.0" fill="#333333">L=1</text>
<rect x="418" y="380" width="20.6" height="10" rx="3" fill="#22a355" stroke="#22a355" stroke-width="1"/>
<text x="444.5793941303274" y="390" text-anchor="start" font-size="9.0" fill="#333333">193 params</text>
<text x="366" y="405" text-anchor="start" font-size="9.0" fill="#333333">L=2</text>
<rect x="418" y="395" width="31.9" height="10" rx="3" fill="#22a355" stroke="#22a355" stroke-width="1"/>
<text x="455.94334607536547" y="405" text-anchor="start" font-size="9.0" fill="#333333">465 params</text>
<text x="366" y="420" text-anchor="start" font-size="9.0" fill="#333333">L=3</text>
<rect x="418" y="410" width="40.2" height="10" rx="3" fill="#22a355" stroke="#22a355" stroke-width="1"/>
<text x="464.21496306363815" y="420" text-anchor="start" font-size="9.0" fill="#333333">737 params</text>
<text x="366" y="435" text-anchor="start" font-size="9.0" fill="#333333">L=4</text>
<rect x="418" y="425" width="47.1" height="10" rx="3" fill="#22a355" stroke="#22a355" stroke-width="1"/>
<text x="471.0543212673288" y="435" text-anchor="start" font-size="9.0" fill="#333333">1009 params</text>
<text x="182" y="442" text-anchor="middle" font-size="9.0" fill="#666666">the h x h matrix makes width ~x4</text>
<text x="518" y="442" text-anchor="middle" font-size="9.0" fill="#666666">each layer adds the same +272</text>
</svg>