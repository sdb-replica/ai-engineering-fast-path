<text x="409" y="116" text-anchor="middle" font-size="10.5" fill="#555555">dot per stop</text>
<text x="340" y="300" text-anchor="middle" font-size="11.5" fill="#1c1c1e">Top-left stop, by hand: each row (0, 0, 1) . (-1, 0, 1) = 1, summed over 3 rows = 3</text>
<rect x="16" y="314" width="648" height="52" rx="8" fill="#fafafa" stroke="#0a7aff" stroke-width="1.5"/>
<text x="340" y="336" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1c1c1e">Same 9 weights at all 9 stops = weight sharing. Output size: (H + 2P - K) / S + 1</text>
<text x="340" y="356" text-anchor="middle" font-size="11" fill="#1c1c1e">stride S = step size of the slide  -  padding P = ring of zeros so edge pixels get scanned too</text>
<text x="340" y="384" text-anchor="middle" font-size="11" fill="#555555">An MLP flattens and forgets neighbourhoods. A conv layer scans for patterns, wherever they occur.</text>
