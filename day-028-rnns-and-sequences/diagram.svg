<text x="340" y="164" text-anchor="middle" font-size="10" fill="#666666">The hidden state h is the only thing carried forward — a running summary, rewritten each step</text>
<line x1="143.0" y1="196" x2="143.0" y2="152" stroke="#555555" stroke-width="2"/><path d="M 143.0 146 L 139.5 153 L 146.5 153 Z" fill="#555555"/>
