<text x="340" y="256" text-anchor="middle" font-size="10" fill="#666666">Inputs arrive one at a time — candles, words, ticks. There is no fixed input width to design around.</text>
<rect x="16" y="272" width="648" height="104" rx="10" fill="#f7f7f8" stroke="#cccccc" stroke-width="1"/>
<text x="340" y="292" text-anchor="middle" font-size="11" font-weight="bold" fill="#1c1c1e">Backprop through time: the gradient fades (Part 3 — loss reads only the final h)</text>
