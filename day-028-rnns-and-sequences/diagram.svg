<svg viewBox="0 0 680 392" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
<rect x="0" y="0" width="680" height="392" fill="#ffffff"/>
<text x="340" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c1c1e">An RNN unrolled: one cell, reused at every step</text>
<text x="340" y="44" text-anchor="middle" font-size="10" fill="#666666">Every copy shares the SAME weights — like Day 26&#x27;s kernel, shared across space, now shared across time</text>
<rect x="84" y="62" width="118" height="84" rx="8" fill="#fff7e6" stroke="#d97706" stroke-width="1.5"/>
<text x="143.0" y="84" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#9a6b00">RNN CELL</text>
<text x="143.0" y="102" text-anchor="middle" font-size="9.5" fill="#333333">tanh(W·x + W·h + b)</text>
<text x="143.0" y="120" text-anchor="middle" font-size="10" fill="#333333">same W_xh, W_hh</text>
<text x="143.0" y="137" text-anchor="middle" font-size="9.5" fill="#333333">h out [+0.66, -0.38]</text>
<rect x="232" y="62" width="118" height="84" rx="8" fill="#fff7e6" stroke="#d97706" stroke-width="1.5"/>
<text x="291.0" y="84" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#9a6b00">RNN CELL</text>
<text x="291.0" y="102" text-anchor="middle" font-size="9.5" fill="#333333">tanh(W·x + W·h + b)</text>
<text x="291.0" y="120" text-anchor="middle" font-size="10" fill="#333333">same W_xh, W_hh</text>
<text x="291.0" y="137" text-anchor="middle" font-size="9.5" fill="#333333">h out [+0.60, -0.17]</text>
<rect x="380" y="62" width="118" height="84" rx="8" fill="#fff7e6" stroke="#d97706" stroke-width="1.5"/>
<text x="439.0" y="84" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#9a6b00">RNN CELL</text>
<text x="439.0" y="102" text-anchor="middle" font-size="9.5" fill="#333333">tanh(W·x + W·h + b)</text>
<text x="439.0" y="120" text-anchor="middle" font-size="10" fill="#333333">same W_xh, W_hh</text>
<text x="439.0" y="137" text-anchor="middle" font-size="9.5" fill="#333333">h out [-0.48, +0.57]</text>
<rect x="528" y="62" width="118" height="84" rx="8" fill="#fff7e6" stroke="#d97706" stroke-width="1.5"/>
<text x="587.0" y="84" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#9a6b00">RNN CELL</text>
<text x="587.0" y="102" text-anchor="middle" font-size="9.5" fill="#333333">tanh(W·x + W·h + b)</text>
<text x="587.0" y="120" text-anchor="middle" font-size="10" fill="#333333">same W_xh, W_hh</text>
<text x="587.0" y="137" text-anchor="middle" font-size="9.5" fill="#333333">h out [+0.55, -0.26]</text>
<rect x="10" y="84" width="52" height="40" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.5"/>
<text x="36" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#0a54c2">h0</text>
<text x="36" y="117" text-anchor="middle" font-size="9.5" fill="#333333">[0, 0]</text>
<line x1="62" y1="104" x2="80" y2="104" stroke="#555555" stroke-width="2"/><path d="M 84 104 L 77 100.5 L 77 107.5 Z" fill="#555555"/>
<line x1="202" y1="104" x2="228" y2="104" stroke="#555555" stroke-width="2"/><path d="M 232 104 L 225 100.5 L 225 107.5 Z" fill="#555555"/>
<text x="217.0" y="96" text-anchor="middle" font-size="10" font-weight="bold" fill="#0a54c2">h1</text>
<line x1="350" y1="104" x2="376" y2="104" stroke="#555555" stroke-width="2"/><path d="M 380 104 L 373 100.5 L 373 107.5 Z" fill="#555555"/>
<text x="365.0" y="96" text-anchor="middle" font-size="10" font-weight="bold" fill="#0a54c2">h2</text>
