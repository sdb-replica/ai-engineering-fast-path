<text x="340" y="400" text-anchor="middle" font-size="9.5" fill="#1c1c1e" font-weight="bold">Var(z) = fan_in x Var(W) x Var(x)   ->   hold the scale: Var(W) = 1/fan_in (Xavier)</text>
<text x="340" y="418" text-anchor="middle" font-size="9.5" fill="#1c1c1e">ReLU zeroes half the signal, so ReLU layers double it: Var(W) = 2/fan_in (He) - biases stay zero</text>
