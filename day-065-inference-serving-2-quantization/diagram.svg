<text x="392.35625" y="248" text-anchor="middle" font-size="9.0" fill="#177245">one step = the scale</text>
<text x="340" y="262" text-anchor="middle" font-size="9.0" fill="#1c1c1e">scale = max|w| / qmax:  int8 divides by 127 (fine steps, tiny error)  -  int4 divides by 7 (coarse steps, 4x fewer bits than fp16)</text>
<rect x="12" y="286" width="656" height="162" rx="8" fill="#ffffff" stroke="#22a355" stroke-width="1.2"/>
<text x="340" y="306" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">B - THE PAYOFF: one 7B model, weights only - and the batch-1 decode floor at 2000 GB/s</text>
<text x="30" y="336" text-anchor="start" font-size="10" fill="#1c1c1e" font-weight="bold">fp32</text>
<rect x="84" y="322" width="294.0" height="19" rx="3" fill="#999999" stroke="none" stroke-width="0"/>
<text x="388.0" y="336" text-anchor="start" font-size="9.5" fill="#1c1c1e">28.00 GB  -  14.00 ms/token  -  at most 71 tok/s</text>
<text x="30" y="363" text-anchor="start" font-size="10" fill="#1c1c1e" font-weight="bold">fp16</text>
<rect x="84" y="349" width="147.0" height="19" rx="3" fill="#0a7aff" stroke="none" stroke-width="0"/>
<text x="241.0" y="363" text-anchor="start" font-size="9.5" fill="#1c1c1e">14.00 GB  -  7.00 ms/token  -  at most 143 tok/s</text>
<text x="30" y="390" text-anchor="start" font-size="10" fill="#1c1c1e" font-weight="bold">int8</text>
<rect x="84" y="376" width="73.5" height="19" rx="3" fill="#22a355" stroke="none" stroke-width="0"/>
<text x="167.5" y="390" text-anchor="start" font-size="9.5" fill="#1c1c1e">7.00 GB  -  3.50 ms/token  -  at most 286 tok/s</text>
<text x="30" y="417" text-anchor="start" font-size="10" fill="#1c1c1e" font-weight="bold">int4</text>
<rect x="84" y="403" width="36.75" height="19" rx="3" fill="#d99a00" stroke="none" stroke-width="0"/>
<text x="130.75" y="417" text-anchor="start" font-size="9.5" fill="#1c1c1e">3.50 GB  -  1.75 ms/token  -  at most 571 tok/s</text>
<text x="340" y="438" text-anchor="middle" font-size="9.0" fill="#177245">decode reads every weight once per token (Day 48): half the bytes is half the wait - fp16 to int4 is a ~4x faster ceiling</text>
