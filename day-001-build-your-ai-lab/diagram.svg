<svg viewBox="0 0 560 190" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, sans-serif">
      <!-- tensor A -->
      <g>
        <rect x="20" y="40" width="110" height="110" rx="10" fill="#eef4ff" stroke="#0a7aff" stroke-width="2"/>
        <text x="75" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#0a54c2">tensor a</text>
        <rect x="35" y="55" width="38" height="38" rx="6" fill="#0a7aff" opacity="0.85"/>
        <rect x="77" y="55" width="38" height="38" rx="6" fill="#0a7aff" opacity="0.55"/>
        <rect x="35" y="97" width="38" height="38" rx="6" fill="#0a7aff" opacity="0.55"/>
        <rect x="77" y="97" width="38" height="38" rx="6" fill="#0a7aff" opacity="0.85"/>
        <text x="35" y="52" font-size="11" fill="#0a54c2">1</text>
        <text x="117" y="52" font-size="11" fill="#0a54c2">2</text>
        <text x="75" y="170" text-anchor="middle" font-size="12" fill="#555">shape [2, 2]</text>
      </g>
      <!-- op -->
      <text x="170" y="105" text-anchor="middle" font-size="26" font-weight="700" fill="#1c1c1e">@</text>
      <!-- tensor B -->
      <g>
        <rect x="210" y="40" width="110" height="110" rx="10" fill="#eef4ff" stroke="#0a7aff" stroke-width="2"/>
        <text x="265" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#0a54c2">tensor b</text>
        <rect x="225" y="55" width="38" height="38" rx="6" fill="#7a5cff" opacity="0.85"/>
        <rect x="267" y="55" width="38" height="38" rx="6" fill="#7a5cff" opacity="0.55"/>
        <rect x="225" y="97" width="38" height="38" rx="6" fill="#7a5cff" opacity="0.55"/>
        <rect x="267" y="97" width="38" height="38" rx="6" fill="#7a5cff" opacity="0.85"/>
        <text x="265" y="170" text-anchor="middle" font-size="12" fill="#555">shape [2, 2]</text>
      </g>
      <!-- arrow -->
      <text x="360" y="105" text-anchor="middle" font-size="26" fill="#22a355">&#8594;</text>
      <!-- result -->
      <g>
        <rect x="400" y="40" width="110" height="110" rx="10" fill="#e9f9ee" stroke="#22a355" stroke-width="2"/>
        <text x="455" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#177245">a @ b</text>
        <rect x="415" y="55" width="38" height="38" rx="6" fill="#22a355" opacity="0.9"/>
        <rect x="457" y="55" width="38" height="38" rx="6" fill="#22a355" opacity="0.6"/>
        <rect x="415" y="97" width="38" height="38" rx="6" fill="#22a355" opacity="0.6"/>
        <rect x="457" y="97" width="38" height="38" rx="6" fill="#22a355" opacity="0.9"/>
        <text x="455" y="170" text-anchor="middle" font-size="12" fill="#555">shape [2, 2]</text>
      </g>
    </svg>