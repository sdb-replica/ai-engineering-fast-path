<svg viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
<rect x="0" y="0" width="680" height="540" rx="0" fill="#ffffff" stroke="none" stroke-width="1.0"/>
<text x="340" y="24" text-anchor="middle" font-size="13.5" fill="#1c1c1e" font-weight="bold">RLHF 1: you can't write the loss for 'good' - but you can rank two outcomes</text>
<text x="340" y="41" text-anchor="middle" font-size="9.5" fill="#666666">SFT needs demonstrations; preferences need only a judge - the reward model bottles the judge</text>
<rect x="12" y="56" width="656" height="178" rx="10" fill="#ffffff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="340" y="76" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">A - FROM RANKINGS TO A SCORE:  PAIRS -&gt; JUDGE -&gt; REWARD MODEL -&gt; ONE NUMBER</text>
<rect x="28" y="92" width="88" height="56" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="72" y="114" text-anchor="middle" font-size="10" fill="#1c1c1e" font-weight="bold">One prompt x</text>
<text x="72" y="132" text-anchor="middle" font-size="8.5" fill="#555555">same question</text>
<rect x="140" y="88" width="110" height="28" rx="6" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="195" y="106" text-anchor="middle" font-size="9.5" fill="#1c1c1e" font-weight="bold">Response A</text>
<rect x="140" y="122" width="110" height="28" rx="6" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="195" y="140" text-anchor="middle" font-size="9.5" fill="#1c1c1e" font-weight="bold">Response B</text>
<text x="195" y="164" text-anchor="middle" font-size="8.5" fill="#555555">two candidates</text>
<rect x="278" y="92" width="110" height="56" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="333" y="114" text-anchor="middle" font-size="10" fill="#1c1c1e" font-weight="bold">Human judge</text>
<text x="333" y="132" text-anchor="middle" font-size="8.5" fill="#555555">picks: A &gt; B</text>
<rect x="416" y="92" width="110" height="56" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="471" y="114" text-anchor="middle" font-size="9.5" fill="#1c1c1e" font-weight="bold">Preference pairs</text>
<text x="471" y="132" text-anchor="middle" font-size="8.5" fill="#555555">42 train / 12 held-out</text>
<rect x="548" y="92" width="104" height="56" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="600" y="114" text-anchor="middle" font-size="9.5" fill="#1c1c1e" font-weight="bold">Reward model</text>
<text x="600" y="132" text-anchor="middle" font-size="8.5" fill="#555555">r(x,y) = w.feats</text>
<line x1="118" y1="119" x2="138" y2="119" stroke="#0a7aff" stroke-width="1.6"/>
<polygon points="138,119 131,115 131,123" fill="#0a7aff"/>
<line x1="252" y1="119" x2="276" y2="119" stroke="#0a7aff" stroke-width="1.6"/>
<polygon points="276,119 269,115 269,123" fill="#0a7aff"/>
<line x1="390" y1="119" x2="414" y2="119" stroke="#0a7aff" stroke-width="1.6"/>
<polygon points="414,119 407,115 407,123" fill="#0a7aff"/>
<line x1="528" y1="119" x2="546" y2="119" stroke="#0a7aff" stroke-width="1.6"/>
<polygon points="546,119 539,115 539,123" fill="#0a7aff"/>
<text x="340" y="182" text-anchor="middle" font-size="9.5" fill="#1c1c1e" font-weight="bold">Bradley-Terry:  P(A beats B) = sigmoid(r_A - r_B)      loss = -log sigmoid(r_chosen - r_rejected)</text>
<text x="340" y="200" text-anchor="middle" font-size="9" fill="#1c1c1e">Day 11 MLE on comparisons: fit the scores that make the human's actual picks most probable</text>
<text x="340" y="218" text-anchor="middle" font-size="9" fill="#0a54c2">the trained score becomes the objective - the policy is optimized against r later (the RL step)</text>
<rect x="12" y="248" width="656" height="188" rx="10" fill="#ffffff" stroke="#22a355" stroke-width="1.2"/>
<text x="340" y="268" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">B - THE LEARNED SCORE AT WORK (HELD-OUT PAIR FROM TODAY'S CODE)</text>
<text x="24" y="292" text-anchor="start" font-size="9.5" fill="#1c1c1e" font-weight="bold">response #58   r = 5.3299</text>
<rect x="24" y="298" width="266" height="16" rx="3" fill="#22a355" stroke="none" stroke-width="1.2"/>
<text x="24" y="336" text-anchor="start" font-size="9.5" fill="#1c1c1e" font-weight="bold">response #47   r = 3.4024</text>
<rect x="24" y="342" width="170" height="16" rx="3" fill="#9adbb2" stroke="none" stroke-width="1.2"/>
<text x="24" y="378" text-anchor="start" font-size="9" fill="#1c1c1e">gap dr = 3.4024 - 5.3299 = -1.9275</text>
<text x="24" y="396" text-anchor="start" font-size="9" fill="#1c1c1e">-&gt; P(#47 beats #58) = 0.1270 - the judge agrees: #58 wins</text>
<text x="24" y="420" text-anchor="start" font-size="9" fill="#177245">one scalar per response: rankable, comparable, optimizable</text>
<line x1="452" y1="410" x2="648" y2="410" stroke="#999999" stroke-width="1.0"/>
<line x1="452" y1="410" x2="452" y2="300" stroke="#999999" stroke-width="1.0"/>
