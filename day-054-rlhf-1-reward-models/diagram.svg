<line x1="502.8" y1="410" x2="502.8" y2="396.0" stroke="#d99a00" stroke-width="1.0" stroke-dasharray="3,3"/>
<line x1="452" y1="396.0" x2="502.8" y2="396.0" stroke="#d99a00" stroke-width="1.0" stroke-dasharray="3,3"/>
<circle cx="502.8" cy="396.0" r="3.5" fill="#d99a00"/>
<circle cx="550.0" cy="355.0" r="3" fill="#22a355"/>
<text x="550" y="290" text-anchor="middle" font-size="9" fill="#1c1c1e" font-weight="bold">sigmoid(dr): gap -&gt; probability</text>
<text x="550" y="428" text-anchor="middle" font-size="8.5" fill="#555555">dr = -1.93 -&gt; P = 0.127      dr = 0 -&gt; P = 0.5</text>
<rect x="12" y="450" width="656" height="74" rx="10" fill="#fff8e6" stroke="#d99a00" stroke-width="1.2"/>
<text x="340" y="472" text-anchor="middle" font-size="9.5" fill="#1c1c1e" font-weight="bold">HONEST NOTE: r IS A PROXY, NOT THE THING ITSELF</text>
<text x="340" y="490" text-anchor="middle" font-size="9" fill="#1c1c1e">the reward model is trained on finite rankings - push a policy hard against any proxy</text>
<text x="340" y="508" text-anchor="middle" font-size="9" fill="#1c1c1e">and it learns to game the score (reward hacking). Goodhart, with gradients - a pointer, for now.</text>
</svg>
