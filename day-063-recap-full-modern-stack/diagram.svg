<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 676" font-family="system-ui, sans-serif" role="img" aria-label="The full modern stack as one vertical pipeline">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d99a00"/></marker>
  </defs>
  <text x="26" y="151" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2" fill="#7a5cff" transform="rotate(-90 26 151)">RUN TIME</text>
  <text x="26" y="472" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2" fill="#0a54c2" transform="rotate(-90 26 472)">BUILD TIME</text>
  <line x1="150" y1="232" x2="288" y2="232" stroke="#ccc" stroke-dasharray="4 4"/>
  <line x1="312" y1="232" x2="450" y2="232" stroke="#ccc" stroke-dasharray="4 4"/>
<rect x="170" y="16" width="260" height="42" rx="8" fill="#f1efff" stroke="#7a5cff" stroke-width="1.6"/>
    <text x="300.0" y="36" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1c1c1e">SERVED PRODUCT</text>
    <text x="300.0" y="54" text-anchor="middle" font-size="10.5" fill="#555">the answer (or action) the user gets</text>
<rect x="170" y="82" width="260" height="138" rx="8" fill="#ffffff" stroke="#7a5cff" stroke-width="1.6"/>
    <text x="300.0" y="102" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1c1c1e">SERVING — per request</text>
    <text x="300.0" y="120" text-anchor="middle" font-size="10.5" fill="#555">assemble the prompt, generate,</text>
    <text x="300.0" y="136" text-anchor="middle" font-size="10.5" fill="#555">call tools, observe, answer</text>
    <text x="300.0" y="152" text-anchor="middle" font-size="10.5" fill="#555">the loop runs per request</text>
    <text x="300.0" y="168" text-anchor="middle" font-size="10.5" fill="#555">Phase E is this box, full-time</text>
<rect x="170" y="244" width="260" height="42" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.6"/>
    <text x="300.0" y="264" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1c1c1e">θ — THE ALIGNED MODEL</text>
    <text x="300.0" y="282" text-anchor="middle" font-size="10.5" fill="#555">one frozen, versioned artifact</text>
<rect x="170" y="310" width="260" height="42" rx="8" fill="#e9f9ee" stroke="#22a355" stroke-width="1.6"/>
    <text x="300.0" y="330" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1c1c1e">57 · EVALS — the gate</text>
    <text x="300.0" y="348" text-anchor="middle" font-size="10.5" fill="#555">scorecard: ship / no-ship</text>
<rect x="170" y="376" width="260" height="52" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.6"/>
    <text x="300.0" y="396" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1c1c1e">54–56 · STEER</text>
    <text x="300.0" y="414" text-anchor="middle" font-size="10.5" fill="#555">preferences: reward model / DPO</text>
    <text x="300.0" y="430" text-anchor="middle" font-size="10.5" fill="#555">checkers: RLVR grades it</text>
<rect x="170" y="452" width="260" height="42" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.6"/>
    <text x="300.0" y="472" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1c1c1e">52 · SFT</text>
    <text x="300.0" y="490" text-anchor="middle" font-size="10.5" fill="#555">instruction pairs teach manners</text>
<rect x="170" y="518" width="260" height="52" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.6"/>
    <text x="300.0" y="538" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1c1c1e">51 · PRETRAINING</text>
    <text x="300.0" y="556" text-anchor="middle" font-size="10.5" fill="#555">next-token prediction at scale</text>
    <text x="300.0" y="572" text-anchor="middle" font-size="10.5" fill="#555">≈ 99.99% of training FLOPs</text>
<rect x="170" y="594" width="260" height="42" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="1.6"/>
    <text x="300.0" y="614" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1c1c1e">RAW DATA — the pile</text>
    <text x="300.0" y="632" text-anchor="middle" font-size="10.5" fill="#555">web text · code · books</text>
<rect x="478" y="90" width="192" height="42" rx="8" fill="#fff8e6" stroke="#d99a00" stroke-width="1.6"/>
    <text x="574.0" y="110" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c1c1e">58–59 · RAG</text>
    <text x="574.0" y="128" text-anchor="middle" font-size="10" fill="#555">fresh facts, per request</text>
<rect x="478" y="140" width="192" height="42" rx="8" fill="#fff8e6" stroke="#d99a00" stroke-width="1.6"/>
    <text x="574.0" y="160" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c1c1e">60–61 · TOOLS + LOOP</text>
    <text x="574.0" y="178" text-anchor="middle" font-size="10" fill="#555">hands: act, observe, repeat</text>
<rect x="478" y="190" width="192" height="42" rx="8" fill="#fff8e6" stroke="#d99a00" stroke-width="1.6"/>
    <text x="574.0" y="210" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c1c1e">62 · PROMPTS</text>
    <text x="574.0" y="228" text-anchor="middle" font-size="10" fill="#555">steer the request itself</text>
<rect x="478" y="452" width="192" height="42" rx="8" fill="#fff8e6" stroke="#d99a00" stroke-width="1.6"/>
    <text x="574.0" y="472" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c1c1e">53 · LoRA / QLoRA</text>
    <text x="574.0" y="490" text-anchor="middle" font-size="10" fill="#555">the cheap patch, any stage</text>
  <line x1="300" y1="594" x2="300" y2="572" stroke="#888" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="300" y1="518" x2="300" y2="496" stroke="#888" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="300" y1="452" x2="300" y2="430" stroke="#888" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="300" y1="376" x2="300" y2="354" stroke="#888" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="300" y1="310" x2="300" y2="288" stroke="#888" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="300" y1="244" x2="300" y2="222" stroke="#888" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="300" y1="82" x2="300" y2="60" stroke="#888" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="476" y1="111" x2="434" y2="111" stroke="#d99a00" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrA)"/>
  <line x1="476" y1="161" x2="434" y2="161" stroke="#d99a00" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrA)"/>
  <line x1="476" y1="211" x2="434" y2="211" stroke="#d99a00" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrA)"/>
  <line x1="476" y1="473" x2="434" y2="473" stroke="#d99a00" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrA)"/>
  <text x="340" y="664" text-anchor="middle" font-size="10" fill="#777">read bottom-up: data in at the floor, product out at the roof · every tag is a day you did</text>
</svg>
