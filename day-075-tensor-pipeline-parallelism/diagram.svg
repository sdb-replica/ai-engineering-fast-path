<text x="340" y="478" text-anchor="middle" font-size="9.5" fill="#1c1c1e">step = M + P - 1 = 7 slots  -  bubble = (P-1) / (M+P-1) = 3/7 = 43% at M=4  -  M=8: 27%  -  M=32: 9%</text>
<rect x="12" y="500" width="656" height="42" rx="10" fill="#fff8e6" stroke="#d99a00" stroke-width="1.2"/>
<text x="340" y="518" text-anchor="middle" font-size="9.5" fill="#1c1c1e" font-weight="bold">DP shards the DATA (Day 74)  -  TP shards WEIGHTS inside a layer  -  PP shards LAYERS across stages</text>
<text x="340" y="534" text-anchor="middle" font-size="9.5" fill="#1c1c1e">frontier runs compose all three (3D parallelism): TP inside the node, PP across nodes, DP across replicas</text>
