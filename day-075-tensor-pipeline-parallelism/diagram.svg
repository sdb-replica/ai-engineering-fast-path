<svg viewBox="0 0 680 552" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
<rect x="0" y="0" width="680" height="552" rx="0" fill="#ffffff" stroke="none" stroke-width="1.0"/>
<rect x="12" y="10" width="656" height="248" rx="10" fill="#ffffff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="340" y="32" text-anchor="middle" font-size="11" fill="#1c1c1e" font-weight="bold">A - TENSOR PARALLELISM: ONE LAYER, TWO GPUs, ONE ALL-REDUCE SEAM</text>
<text x="340" y="48" text-anchor="middle" font-size="9.5" fill="#666666">the row cut: each GPU owns half the input features, so each holds only a partial sum</text>
<rect x="275" y="58" width="130" height="36" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="340" y="74" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">X (4x8)</text>
<text x="340" y="88" text-anchor="middle" font-size="8.5" fill="#555555">same input, both GPUs</text>
<line x1="312" y1="94" x2="196" y2="114" stroke="#0a7aff" stroke-width="1.6"/>
<polygon points="192,116 202,115 197,108" fill="#0a7aff"/>
<line x1="368" y1="94" x2="484" y2="114" stroke="#0a7aff" stroke-width="1.6"/>
<polygon points="488,116 483,108 478,115" fill="#0a7aff"/>
<rect x="45" y="118" width="262" height="62" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="176" y="138" text-anchor="middle" font-size="10" fill="#1c1c1e" font-weight="bold">GPU 0 - W rows 0-3 (4x6)</text>
<text x="176" y="154" text-anchor="middle" font-size="9" fill="#1c1c1e">partial P0 = X[:, :4] @ W[:4, :]</text>
<text x="176" y="169" text-anchor="middle" font-size="9" fill="#0a54c2">P0 row 0: [8, -11, 5, -4, 2, 8]</text>
<line x1="176" y1="180" x2="176" y2="198" stroke="#d99a00" stroke-width="1.6"/>
<polygon points="176,202 172,195 180,195" fill="#d99a00"/>
<rect x="373" y="118" width="262" height="62" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="504" y="138" text-anchor="middle" font-size="10" fill="#1c1c1e" font-weight="bold">GPU 1 - W rows 4-7 (4x6)</text>
<text x="504" y="154" text-anchor="middle" font-size="9" fill="#1c1c1e">partial P1 = X[:, 4:] @ W[4:, :]</text>
<text x="504" y="169" text-anchor="middle" font-size="9" fill="#0a54c2">P1 row 0: [-5, 0, 10, 0, -5, -5]</text>
<line x1="504" y1="180" x2="504" y2="198" stroke="#d99a00" stroke-width="1.6"/>
<polygon points="504,202 500,195 508,195" fill="#d99a00"/>
<rect x="120" y="202" width="440" height="28" rx="8" fill="#fdeeda" stroke="#d99a00" stroke-width="1.4"/>
<text x="340" y="220" text-anchor="middle" font-size="10" fill="#1c1c1e" font-weight="bold">ALL-REDUCE:  Y = P0 + P1  -&gt;  row 0: [3, -11, 15, -4, -3, 3]</text>
<text x="340" y="248" text-anchor="middle" font-size="9" fill="#1c1c1e">column cut is the mirror: split W by output features and concat - the sum lands in the next layer instead (Megatron pairs both cuts)</text>
<rect x="12" y="272" width="656" height="216" rx="10" fill="#ffffff" stroke="#22a355" stroke-width="1.2"/>
<text x="340" y="294" text-anchor="middle" font-size="11" fill="#1c1c1e" font-weight="bold">B - PIPELINE PARALLELISM: 4 STAGES, 4 MICRO-BATCHES, ONE STEP</text>
<text x="340" y="310" text-anchor="middle" font-size="9.5" fill="#666666">grey cells are the bubble: the stage holds its layers but the line has not reached it yet - or has drained past it</text>
<text x="155" y="330" text-anchor="middle" font-size="9" fill="#666666">slot 1</text>
<text x="232" y="330" text-anchor="middle" font-size="9" fill="#666666">slot 2</text>
<text x="309" y="330" text-anchor="middle" font-size="9" fill="#666666">slot 3</text>
