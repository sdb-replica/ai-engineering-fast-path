<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" role="img" aria-label="Two-column map: Phase F ML systems concepts on the left, their infra-world equivalents on the right">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>
  <text x="137" y="22" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#555">PHASE F — ML VOCABULARY</text>
  <text x="340" y="22" text-anchor="middle" font-size="11" fill="#999">— same idea —</text>
  <text x="542" y="22" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#555">YOUR WORLD — INFRA VOCABULARY</text>

  <!-- Day 73 -->
  <rect x="10" y="36" width="255" height="38" rx="8" fill="#eef4ff" stroke="#0a7aff"/>
  <rect x="415" y="36" width="255" height="38" rx="8" fill="#eef4ff" stroke="#0a7aff"/>
  <line x1="268" y1="55" x2="410" y2="55" stroke="#bbb" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="22" y="59" font-size="12" fill="#1c1c1e">73 · The memory wall</text>
  <text x="427" y="59" font-size="12" fill="#1c1c1e">capacity planning</text>

  <!-- Day 74 -->
  <rect x="10" y="80" width="255" height="38" rx="8" fill="#eef4ff" stroke="#0a7aff"/>
  <rect x="415" y="80" width="255" height="38" rx="8" fill="#eef4ff" stroke="#0a7aff"/>
  <line x1="268" y1="99" x2="410" y2="99" stroke="#bbb" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="22" y="103" font-size="12" fill="#1c1c1e">74 · Data parallelism</text>
  <text x="427" y="103" font-size="12" fill="#1c1c1e">sharded workers + gossip</text>

  <!-- Day 75 -->
  <rect x="10" y="124" width="255" height="38" rx="8" fill="#fff8e6" stroke="#d99a00"/>
  <rect x="415" y="124" width="255" height="38" rx="8" fill="#fff8e6" stroke="#d99a00"/>
  <line x1="268" y1="143" x2="410" y2="143" stroke="#bbb" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="22" y="147" font-size="12" fill="#1c1c1e">75 · Tensor + pipeline parallel</text>
  <text x="427" y="147" font-size="12" fill="#1c1c1e">striping one job across nodes</text>

  <!-- Day 76 -->
  <rect x="10" y="168" width="255" height="38" rx="8" fill="#eef4ff" stroke="#0a7aff"/>
  <rect x="415" y="168" width="255" height="38" rx="8" fill="#eef4ff" stroke="#0a7aff"/>
  <line x1="268" y1="187" x2="410" y2="187" stroke="#bbb" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="22" y="191" font-size="12" fill="#1c1c1e">76 · FSDP / DeepSpeed</text>
  <text x="427" y="191" font-size="12" fill="#1c1c1e">consistent sharding of state</text>

  <!-- Day 77 -->
  <rect x="10" y="212" width="255" height="38" rx="8" fill="#fff8e6" stroke="#d99a00"/>
  <rect x="415" y="212" width="255" height="38" rx="8" fill="#fff8e6" stroke="#d99a00"/>
  <line x1="268" y1="231" x2="410" y2="231" stroke="#bbb" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="22" y="235" font-size="12" fill="#1c1c1e">77 · Mixed precision (bf16)</text>
  <text x="427" y="235" font-size="12" fill="#1c1c1e">tiered copies of the data</text>

  <!-- Day 78 — HOME TURF -->
  <rect x="10" y="256" width="255" height="38" rx="8" fill="#e9f9ee" stroke="#22a355" stroke-width="2"/>
  <rect x="415" y="256" width="255" height="38" rx="8" fill="#e9f9ee" stroke="#22a355" stroke-width="2"/>
  <line x1="268" y1="275" x2="410" y2="275" stroke="#22a355" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="22" y="279" font-size="12" font-weight="700" fill="#1c1c1e">78 · Checkpointing + repair</text>
  <text x="427" y="279" font-size="12" font-weight="700" fill="#1c1c1e">backup, restore, repair (DRS) ★</text>

  <!-- Day 79 -->
  <rect x="10" y="300" width="255" height="38" rx="8" fill="#fff8e6" stroke="#d99a00"/>
  <rect x="415" y="300" width="255" height="38" rx="8" fill="#fff8e6" stroke="#d99a00"/>
  <line x1="268" y1="319" x2="410" y2="319" stroke="#bbb" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="22" y="323" font-size="12" fill="#1c1c1e">79 · GPU / CUDA mental model</text>
  <text x="427" y="323" font-size="12" fill="#1c1c1e">a new machine architecture</text>

  <!-- Day 80 -->
  <rect x="10" y="344" width="255" height="38" rx="8" fill="#eef4ff" stroke="#0a7aff"/>
  <rect x="415" y="344" width="255" height="38" rx="8" fill="#eef4ff" stroke="#0a7aff"/>
  <line x1="268" y1="363" x2="410" y2="363" stroke="#bbb" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="22" y="367" font-size="12" fill="#1c1c1e">80 · Inference at scale</text>
  <text x="427" y="367" font-size="12" fill="#1c1c1e">split paths, shaped traffic</text>

  <!-- Day 81 — HOME TURF -->
  <rect x="10" y="388" width="255" height="38" rx="8" fill="#e9f9ee" stroke="#22a355" stroke-width="2"/>
  <rect x="415" y="388" width="255" height="38" rx="8" fill="#e9f9ee" stroke="#22a355" stroke-width="2"/>
  <line x1="268" y1="407" x2="410" y2="407" stroke="#22a355" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="22" y="411" font-size="12" font-weight="700" fill="#1c1c1e">81 · Profile a training step</text>
  <text x="427" y="411" font-size="12" font-weight="700" fill="#1c1c1e">observability, as always ★</text>

  <!-- Legend -->
  <rect x="10" y="440" width="12" height="12" fill="#e9f9ee" stroke="#22a355"/>
  <text x="28" y="450" font-size="10.5" fill="#555">HOME TURF — shipped it</text>
  <rect x="210" y="440" width="12" height="12" fill="#eef4ff" stroke="#0a7aff"/>
  <text x="228" y="450" font-size="10.5" fill="#555">STRONG TRANSFER — concepts yours, machinery new</text>
  <rect x="508" y="440" width="12" height="12" fill="#fff8e6" stroke="#d99a00"/>
  <text x="526" y="450" font-size="10.5" fill="#555">NEW GROUND — honestly new</text>
</svg>
