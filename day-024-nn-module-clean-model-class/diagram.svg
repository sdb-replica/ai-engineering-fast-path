<svg viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
<rect x="0" y="0" width="680" height="500" fill="#ffffff"/>
<text x="340" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c1c1e">nn.Module: you write the class, the registry keeps the books</text>
<rect x="16" y="52" width="204" height="159" rx="8" fill="#fafafa" stroke="#0a7aff" stroke-width="1.5"/>
<text x="118.0" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#0a54c2">YOU WRITE</text>
<text x="118.0" y="93" text-anchor="middle" font-size="11" font-weight="bold" fill="#1c1c1e">class XORNet(nn.Module):</text>
<text x="118.0" y="112" text-anchor="middle" font-size="11" fill="#1c1c1e">__init__: declare layers</text>
<text x="118.0" y="131" text-anchor="middle" font-size="11" fill="#1c1c1e">self.fc1 = Linear(2, 4)</text>
<text x="118.0" y="150" text-anchor="middle" font-size="11" fill="#1c1c1e">self.fc2 = Linear(4, 1)</text>
<text x="118.0" y="169" text-anchor="middle" font-size="11" fill="#1c1c1e">forward(x): the flow</text>
<text x="118.0" y="188" text-anchor="middle" font-size="11" fill="#1c1c1e">fc1 -&gt; ReLU -&gt; fc2</text>
<rect x="238" y="52" width="204" height="159" rx="8" fill="#fafafa" stroke="#22a355" stroke-width="1.5"/>
<text x="340.0" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#0a54c2">MODULE REGISTRY</text>
<text x="340.0" y="93" text-anchor="middle" font-size="11" fill="#1c1c1e">parameters(): 17 found</text>
<text x="340.0" y="112" text-anchor="middle" font-size="11" fill="#1c1c1e">named_parameters()</text>
<text x="340.0" y="131" text-anchor="middle" font-size="11" fill="#1c1c1e">state_dict(): snapshot</text>
<text x="340.0" y="150" text-anchor="middle" font-size="11" fill="#1c1c1e">train() / eval(): mode</text>
<text x="340.0" y="169" text-anchor="middle" font-size="11" fill="#1c1c1e">to(device): moves all</text>
<text x="340.0" y="188" text-anchor="middle" font-size="11" fill="#1c1c1e">all recursive, for free</text>
<rect x="460" y="52" width="204" height="159" rx="8" fill="#fafafa" stroke="#d99a00" stroke-width="1.5"/>
<text x="562.0" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#0a54c2">YOU USE</text>
<text x="562.0" y="93" text-anchor="middle" font-size="11" fill="#1c1c1e">model = XORNet()</text>
<text x="562.0" y="112" text-anchor="middle" font-size="11" fill="#1c1c1e">pred = model(x)</text>
<text x="562.0" y="131" text-anchor="middle" font-size="11" fill="#1c1c1e">never model.forward(x)</text>
<text x="562.0" y="150" text-anchor="middle" font-size="11" fill="#1c1c1e">SGD(model.parameters())</text>
<text x="562.0" y="169" text-anchor="middle" font-size="11" fill="#1c1c1e">fresh.load_state_dict(sd)</text>
<text x="562.0" y="188" text-anchor="middle" font-size="11" fill="#1c1c1e">save / restore / deploy</text>
<line x1="222" y1="115" x2="229" y2="115" stroke="#0a7aff" stroke-width="2"/>
<path d="M 236 115 L 229 111 L 229 119 Z" fill="#0a7aff"/>
<line x1="444" y1="115" x2="451" y2="115" stroke="#0a7aff" stroke-width="2"/>
<path d="M 458 115 L 451 111 L 451 119 Z" fill="#0a7aff"/>
<text x="340" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#0a54c2">ONE INSTANCE, END TO END — the XOR net from Days 21-22, packaged</text>
<rect x="16" y="254" width="112" height="62" rx="8" fill="#fafafa" stroke="#0a7aff" stroke-width="1.5"/>
<text x="72" y="280" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1c1c1e">x</text>
<text x="72" y="298" text-anchor="middle" font-size="11" fill="#1c1c1e">[4, 2] batch</text>
<rect x="150" y="254" width="112" height="62" rx="8" fill="#fafafa" stroke="#0a7aff" stroke-width="1.5"/>
<text x="206" y="280" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1c1c1e">fc1</text>
<text x="206" y="298" text-anchor="middle" font-size="11" fill="#1c1c1e">Linear 2-&gt;4</text>
<rect x="284" y="254" width="112" height="62" rx="8" fill="#fafafa" stroke="#0a7aff" stroke-width="1.5"/>
<text x="340" y="280" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1c1c1e">ReLU</text>
<text x="340" y="298" text-anchor="middle" font-size="11" fill="#1c1c1e">the bend</text>
<rect x="418" y="254" width="112" height="62" rx="8" fill="#fafafa" stroke="#0a7aff" stroke-width="1.5"/>
<text x="474" y="280" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1c1c1e">fc2</text>
<text x="474" y="298" text-anchor="middle" font-size="11" fill="#1c1c1e">Linear 4-&gt;1</text>
<rect x="552" y="254" width="112" height="62" rx="8" fill="#fafafa" stroke="#0a7aff" stroke-width="1.5"/>
<text x="608" y="280" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1c1c1e">pred</text>
<text x="608" y="298" text-anchor="middle" font-size="11" fill="#1c1c1e">[4, 1] out</text>
<line x1="130" y1="285" x2="141" y2="285" stroke="#0a7aff" stroke-width="2"/>
<path d="M 148 285 L 141 281 L 141 289 Z" fill="#0a7aff"/>
<line x1="264" y1="285" x2="275" y2="285" stroke="#0a7aff" stroke-width="2"/>
<path d="M 282 285 L 275 281 L 275 289 Z" fill="#0a7aff"/>
<line x1="398" y1="285" x2="409" y2="285" stroke="#0a7aff" stroke-width="2"/>
<path d="M 416 285 L 409 281 L 409 289 Z" fill="#0a7aff"/>
<line x1="532" y1="285" x2="543" y2="285" stroke="#0a7aff" stroke-width="2"/>
<path d="M 550 285 L 543 281 L 543 289 Z" fill="#0a7aff"/>
<text x="340" y="344" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1c1c1e">fc1: 8 weights + 4 biases  -  fc2: 4 weights + 1 bias  -  17 parameters, all registered</text>
<rect x="16" y="366" width="648" height="56" rx="8" fill="#fafafa" stroke="#c22f2f" stroke-width="1.5"/>
<text x="340" y="390" text-anchor="middle" font-size="12" font-weight="bold" fill="#c22f2f">Assigned to self in __init__ = registered and found forever.</text>
<text x="340" y="410" text-anchor="middle" font-size="11.5" fill="#c22f2f">Created as a plain local variable = gone when __init__ returns.</text>
<text x="340" y="452" text-anchor="middle" font-size="11.5" fill="#1c1c1e">Same class, many instances: a fresh XORNet() + the saved state_dict</text>
<text x="340" y="472" text-anchor="middle" font-size="11.5" fill="#1c1c1e">reproduces the trained model exactly - max diff 0.000000 (Part 3).</text>
</svg>
