<text x="70.0" y="370.7988" text-anchor="middle" font-size="9" fill="#177245" font-weight="bold" >0.60</text>
<text x="624.0" y="350.0826" text-anchor="end" font-size="9" fill="#177245" font-weight="bold" >pass@4 1.00</text>
<text x="70" y="466" text-anchor="middle" font-size="8.5" fill="#666666" font-weight="normal" >round 0</text>
