<svg viewBox="0 0 680 548" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
<rect x="0" y="0" width="680" height="548" rx="0" fill="#ffffff"/>
<text x="340" y="26" text-anchor="middle" font-size="13.5" fill="#1c1c1e" font-weight="bold">Why training doesn't fit on one GPU: the memory wall</text>
<text x="340" y="44" text-anchor="middle" font-size="9.5" fill="#666666">A 70B model, Adam + mixed precision: static bill 1,120 GB, activations on top</text>
<rect x="12" y="58" width="656" height="254" rx="10" fill="#ffffff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="340" y="80" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">A - ONE TRAINING STEP, 70B MODEL: THE STACKED BILL (GB)</text>
<rect x="150" y="108" width="77" height="48" rx="2" fill="#0a7aff"/>
<text x="188.5" y="129" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">master</text>
<text x="188.5" y="144" text-anchor="middle" font-size="9" fill="#ffffff">280 GB</text>
<rect x="227" y="108" width="77" height="48" rx="2" fill="#7a5cff"/>
<text x="265.5" y="129" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">grads</text>
<text x="265.5" y="144" text-anchor="middle" font-size="9" fill="#ffffff">280 GB</text>
<rect x="304" y="108" width="77" height="48" rx="2" fill="#22a355"/>
<text x="342.5" y="129" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">Adam m</text>
<text x="342.5" y="144" text-anchor="middle" font-size="9" fill="#ffffff">280 GB</text>
<rect x="381" y="108" width="77" height="48" rx="2" fill="#d99a00"/>
<text x="419.5" y="129" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">Adam v</text>
<text x="419.5" y="144" text-anchor="middle" font-size="9" fill="#ffffff">280 GB</text>
<rect x="458" y="108" width="188" height="48" rx="2" fill="#e5484d"/>
<text x="552.0" y="129" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="bold">activations</text>
<text x="552.0" y="144" text-anchor="middle" font-size="9" fill="#ffffff">687 GB</text>
<text x="150" y="182" text-anchor="start" font-size="9.5" fill="#1c1c1e">static 1,120 GB + activations 687 GB = 1,807 GB for one step</text>
<text x="150" y="200" text-anchor="start" font-size="9" fill="#555555">the whole bar is ONE micro-batch step: batch 8 x seq 4096, 80 layers, bf16</text>
<line x1="172" y1="100" x2="172" y2="164" stroke="#e5484d" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="178" y="98" text-anchor="start" font-size="9" fill="#e5484d" font-weight="bold">80 GB = one GPU</text>
<text x="150" y="236" text-anchor="start" font-size="9.5" fill="#1c1c1e">inference only, bf16 weights:</text>
<rect x="150" y="248" width="38" height="20" rx="2" fill="#0a7aff"/>
<text x="196" y="263" text-anchor="start" font-size="9.5" fill="#1c1c1e">140 GB - even serving the weights alone overflows one 80 GB card</text>
<text x="150" y="296" text-anchor="start" font-size="9" fill="#555555">Day 34's XOR net, for scale: 17 params x 16 B = 272 bytes (a dot at this scale)</text>
<rect x="12" y="322" width="656" height="214" rx="10" fill="#ffffff" stroke="#22a355" stroke-width="1.2"/>
<text x="340" y="344" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">B - THE SAME BILL, COUNTED IN GPUS (80 GB EACH)</text>
<rect x="28" y="366" width="84" height="52" rx="8" fill="#ffffff" stroke="#0a7aff" stroke-width="1.4"/>
<text x="70" y="390" text-anchor="middle" font-size="10" fill="#1c1c1e" font-weight="bold">1 GPU</text>
<text x="70" y="406" text-anchor="middle" font-size="9" fill="#555555">80 GB</text>
<text x="140" y="362" text-anchor="start" font-size="9.5" fill="#1c1c1e">23 GPUs - no checkpointing: 1,807 GB</text>
