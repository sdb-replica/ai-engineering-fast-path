<text x="340" y="478" text-anchor="middle" font-size="9.5" fill="#1c1c1e">checkpointing trades ~1/3 extra step time for 8 fewer GPUs</text>
<text x="340" y="498" text-anchor="middle" font-size="9.5" fill="#1c1c1e" font-weight="bold">the wall is arithmetic: 16 B/param + activations vs 80 GB/card</text>
