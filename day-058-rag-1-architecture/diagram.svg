<svg viewBox="0 0 680 478" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
<rect x="0" y="0" width="680" height="478" rx="0" fill="#ffffff" stroke="none" stroke-width="1.0"/>
<text x="340" y="24" text-anchor="middle" font-size="13" fill="#1c1c1e" font-weight="bold">RAG: fetch the knowledge at query time - don&#x27;t bake it into the weights</text>
<text x="340" y="41" text-anchor="middle" font-size="9.5" fill="#666666">Two paths you already know: an offline build job, and an online read path</text>
<rect x="12" y="54" width="656" height="118" rx="10" fill="#ffffff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="340" y="74" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">A - OFFLINE: THE WRITE PATH (runs when documents change - no user waiting)</text>
<rect x="28" y="88" width="130" height="52" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="93.0" y="110" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">Documents</text>
<text x="93.0" y="128" text-anchor="middle" font-size="8.5" fill="#555555">design docs, wiki</text>
<rect x="190" y="88" width="130" height="52" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="255.0" y="110" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">Chunk</text>
<text x="255.0" y="128" text-anchor="middle" font-size="8.5" fill="#555555">split: ~1 idea each</text>
<rect x="352" y="88" width="140" height="52" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="422.0" y="110" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">Embed</text>
<text x="422.0" y="128" text-anchor="middle" font-size="8.5" fill="#555555">chunk -&gt; vector</text>
<rect x="524" y="88" width="128" height="52" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.2"/>
<text x="588.0" y="110" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">Index</text>
<text x="588.0" y="128" text-anchor="middle" font-size="8.5" fill="#555555">store vector + text</text>
<line x1="160" y1="114" x2="188" y2="114" stroke="#0a7aff" stroke-width="1.6"/>
<polygon points="188,114 181,110 181,118" fill="#0a7aff"/>
<line x1="322" y1="114" x2="350" y2="114" stroke="#0a7aff" stroke-width="1.6"/>
<polygon points="350,114 343,110 343,118" fill="#0a7aff"/>
<line x1="494" y1="114" x2="522" y2="114" stroke="#0a7aff" stroke-width="1.6"/>
<polygon points="522,114 515,110 515,118" fill="#0a7aff"/>
<text x="340" y="160" text-anchor="middle" font-size="9" fill="#1c1c1e">Day 15&#x27;s embeddings do this job in real systems; today&#x27;s code uses TF-IDF so you can see every number</text>
<rect x="12" y="188" width="656" height="86" rx="10" fill="#f1efff" stroke="#7a5cff" stroke-width="1.2"/>
<text x="340" y="208" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">THE VECTOR STORE - the model&#x27;s external memory (a secondary index, not weights)</text>
<text x="340" y="230" text-anchor="middle" font-size="9.5" fill="#1c1c1e">chunk 0 text  &lt;-&gt;  [0.00, 0.00, 2.50, 1.59, 2.50, ...]      chunk 5 text  &lt;-&gt;  [ ... ]</text>
<text x="340" y="250" text-anchor="middle" font-size="9.5" fill="#1c1c1e">one row per chunk: the words AND the vector that finds them</text>
<text x="340" y="266" text-anchor="middle" font-size="9" fill="#5a3fd4">updating knowledge = re-chunk + re-index - the model itself never changes</text>
<line x1="588" y1="142" x2="588" y2="186" stroke="#7a5cff" stroke-width="1.6"/>
<polygon points="588,186 584,179 592,179" fill="#7a5cff"/>
<rect x="12" y="290" width="656" height="118" rx="10" fill="#ffffff" stroke="#22a355" stroke-width="1.2"/>
<text x="340" y="310" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">B - ONLINE: THE READ PATH (runs per question - the user IS waiting)</text>
<rect x="24" y="324" width="104" height="52" rx="8" fill="#e9f9ee" stroke="#22a355" stroke-width="1.2"/>
<text x="76.0" y="346" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">Question</text>
<text x="76.0" y="364" text-anchor="middle" font-size="8.5" fill="#555555">user asks</text>
<rect x="152" y="324" width="116" height="52" rx="8" fill="#e9f9ee" stroke="#22a355" stroke-width="1.2"/>
<text x="210.0" y="346" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">Embed query</text>
<text x="210.0" y="364" text-anchor="middle" font-size="8.5" fill="#555555">SAME embedder</text>
<rect x="292" y="324" width="124" height="52" rx="8" fill="#e9f9ee" stroke="#22a355" stroke-width="1.2"/>
<text x="354.0" y="346" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">Retrieve top-k</text>
<text x="354.0" y="364" text-anchor="middle" font-size="8.5" fill="#555555">cosine-rank rows</text>
<rect x="440" y="324" width="116" height="52" rx="8" fill="#e9f9ee" stroke="#22a355" stroke-width="1.2"/>
<text x="498.0" y="346" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">Stuff context</text>
<text x="498.0" y="364" text-anchor="middle" font-size="8.5" fill="#555555">chunks -&gt; prompt</text>
<rect x="580" y="324" width="76" height="52" rx="8" fill="#e9f9ee" stroke="#22a355" stroke-width="1.2"/>
<text x="618.0" y="346" text-anchor="middle" font-size="10.5" fill="#1c1c1e" font-weight="bold">Generate</text>
<text x="618.0" y="364" text-anchor="middle" font-size="8.5" fill="#555555">the LLM</text>
<line x1="130" y1="350" x2="150" y2="350" stroke="#22a355" stroke-width="1.6"/>
<polygon points="150,350 143,346 143,354" fill="#22a355"/>
<line x1="270" y1="350" x2="290" y2="350" stroke="#22a355" stroke-width="1.6"/>
<polygon points="290,350 283,346 283,354" fill="#22a355"/>
<line x1="418" y1="350" x2="438" y2="350" stroke="#22a355" stroke-width="1.6"/>
<polygon points="438,350 431,346 431,354" fill="#22a355"/>
<line x1="558" y1="350" x2="578" y2="350" stroke="#22a355" stroke-width="1.6"/>
<polygon points="578,350 571,346 571,354" fill="#22a355"/>
<text x="340" y="396" text-anchor="middle" font-size="9" fill="#1c1c1e">the answer can only be as good as the chunks retrieval handed it - garbage in, confident garbage out</text>
<line x1="354" y1="322" x2="354" y2="276" stroke="#7a5cff" stroke-width="1.6"/>
<polygon points="354,276 350,269 358,269" fill="#7a5cff"/>
<text x="300" y="286" text-anchor="middle" font-size="8.5" fill="#5a3fd4">reads</text>
<rect x="12" y="422" width="656" height="42" rx="10" fill="#fff8e6" stroke="#d99a00" stroke-width="1.2"/>
<text x="340" y="440" text-anchor="middle" font-size="9.5" fill="#1c1c1e" font-weight="bold">Weights = frozen skills. Index = live knowledge. RAG keeps them separate on purpose.</text>
<text x="340" y="456" text-anchor="middle" font-size="9.5" fill="#1c1c1e">Failure modes live in the seams: bad chunks, missed retrieval, a stale index.</text>
</svg>
