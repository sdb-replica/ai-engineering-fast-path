<svg viewBox="0 0 680 348" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
<defs>
<pattern id="idle" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
<rect width="7" height="7" fill="#fdecec"/>
<line x1="0" y1="0" x2="0" y2="7" stroke="#e5484d" stroke-width="2.4"/>
</pattern>
</defs>
<rect x="0" y="0" width="680" height="348" rx="0" fill="#ffffff" stroke="none" stroke-width="1.0"/>
<text x="340" y="24" text-anchor="middle" font-size="13.5" fill="#1c1c1e" font-weight="bold">One training step, profiled: where the milliseconds actually go</text>
<text x="340" y="41" text-anchor="middle" font-size="9.5" fill="#666666">Day 81 - same step, same math, two loader designs (reference shares - your digits will differ, the shape won&#x27;t)</text>
<text x="30" y="64" font-size="11" fill="#1c1c1e" font-weight="bold">RUN A - on-demand loader: the feature pass sits INSIDE the step</text>
<line x1="397.6" y1="74" x2="652.2" y2="74" stroke="#177245" stroke-width="1.4"/>
<line x1="397.6" y1="70" x2="397.6" y2="78" stroke="#177245" stroke-width="1.4"/>
<line x1="652.2" y1="70" x2="652.2" y2="78" stroke="#177245" stroke-width="1.4"/>
<text x="524.9" y="70" text-anchor="middle" font-size="9.5" fill="#177245">accelerator busy: 41%</text>
<rect x="30.0" y="88" width="367.6" height="34" fill="url(#idle)" stroke="#e5484d" stroke-width="1.0"/>
<rect x="397.6" y="88" width="1.5" height="34" fill="#9a9aa0" stroke="none"/>
<rect x="399.1" y="88" width="102.2" height="34" fill="#0a7aff" stroke="none"/>
<rect x="501.3" y="88" width="149.4" height="34" fill="#0a54c2" stroke="none"/>
<rect x="650.7" y="88" width="1.5" height="34" fill="#22a355" stroke="none"/>
<text x="213.8" y="109" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="bold">data 59%</text>
<text x="450.2" y="109" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="bold">forward 16%</text>
<text x="576.0" y="109" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="bold">backward 24%</text>
<text x="30" y="138" font-size="9.5" fill="#555555">copy ~0% and optimizer step ~0% are too thin to draw at this scale - on a GPU box, copy is the host-&gt;device transfer.</text>
<text x="30" y="156" font-size="10.5" fill="#c62f36" font-weight="bold">During the hatched 59%, the accelerator does NOTHING but wait. Verdict: DATA-BOUND.</text>
<text x="30" y="186" font-size="11" fill="#1c1c1e" font-weight="bold">RUN B - prefetched loader: the same pass, paid once up front - the bar keeps Run A&#x27;s scale</text>
<rect x="30.0" y="204" width="1.5" height="34" fill="#e5484d" stroke="none"/>
<rect x="31.5" y="204" width="1.5" height="34" fill="#9a9aa0" stroke="none"/>
<rect x="33.0" y="204" width="101.2" height="34" fill="#0a7aff" stroke="none"/>
<rect x="134.2" y="204" width="147.0" height="34" fill="#0a54c2" stroke="none"/>
<rect x="281.3" y="204" width="1.5" height="34" fill="#22a355" stroke="none"/>
<rect x="282.8" y="204" width="369.4" height="34" fill="none" stroke="#177245" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="83.6" y="225" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="bold">forward</text>
<text x="207.8" y="225" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="bold">backward</text>
<text x="292.8" y="225" font-size="10" fill="#177245" font-weight="bold">handed back</text>
<text x="30" y="254" font-size="9.5" fill="#555555">data ~0% now - the fetch is a dict lookup. Step total: 40% of Run A, so 2.5x more steps/s - and Part 2 proves the losses are unchanged, digit for digit.</text>
<text x="30" y="272" font-size="10.5" fill="#177245" font-weight="bold">What remains is forward + backward: the step is COMPUTE-BOUND - a different disease, a different cure.</text>
<rect x="12" y="288" width="656" height="48" rx="10" fill="#fff8e6" stroke="#d99a00" stroke-width="1.2"/>
<text x="340" y="308" text-anchor="middle" font-size="10" fill="#1c1c1e" font-weight="bold">Diagnose first: busy share low -&gt; fix the LOADER (prefetch, more workers, cheaper prep).</text>
<text x="340" y="326" text-anchor="middle" font-size="10" fill="#1c1c1e">Busy share ~100% -&gt; fix the COMPUTE (bigger batch, faster kernels). The cures never cross - a faster GPU buys nothing in Run A.</text>
</svg>
