<rect x="12" y="404" width="656" height="44" rx="10" fill="#fff8e6" stroke="#d99a00" stroke-width="1.2"/>
<text x="340" y="422" text-anchor="middle" font-size="9.5" fill="#1c1c1e" font-weight="bold">The corpus is you: a hallucinated reason for a trade is a false memory, not just a wrong fact -</text>
<text x="340" y="438" text-anchor="middle" font-size="9.5" fill="#1c1c1e">so this gate fires earlier than Day 59&#x27;s, and errs toward silence.</text>
