<text x="340" y="228" text-anchor="middle" font-size="10.5" fill="#666666">Step 5 cannot start until step 4 finishes -- and step 1 is 4 rewrites away from the answer</text>
<rect x="8" y="252" width="216" height="48" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/>
<text x="116" y="272" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7b241c">1 - SEQUENTIAL</text>
<text x="116" y="289" text-anchor="middle" font-size="9.5" fill="#7b241c">T chained steps, no parallelism</text>
<rect x="232" y="252" width="216" height="48" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/>
<text x="340" y="272" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7b241c">2 - FADING MEMORY</text>
<text x="340" y="289" text-anchor="middle" font-size="9.5" fill="#7b241c">57,860x weaker at 20 steps back</text>
<rect x="456" y="252" width="216" height="48" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/>
<text x="564" y="272" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7b241c">3 - THE SQUEEZE</text>
<text x="564" y="289" text-anchor="middle" font-size="9.5" fill="#7b241c">the whole past must fit in one fixed h</text>
<rect x="8" y="316" width="664" height="172" rx="10" fill="#f4fbf6" stroke="#22a355" stroke-width="1.5"/>
<text x="340" y="340" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#177245">LOOK AT EVERYTHING AT ONCE -- no chain, no squeeze</text>
<rect x="64" y="356" width="100" height="36" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.5"/>
<text x="114" y="379" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0a54c2">x1</text>
<rect x="180" y="356" width="100" height="36" rx="8" fill="#eef4ff" stroke="#0a7aff" stroke-width="1.5"/>
<text x="230" y="379" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0a54c2">x2</text>
