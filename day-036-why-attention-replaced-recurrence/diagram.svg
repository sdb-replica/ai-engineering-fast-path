<text x="340" y="449" text-anchor="middle" font-size="11" font-weight="bold" fill="#177245">the step that needs the past</text>
<text x="340" y="478" text-anchor="middle" font-size="10.5" fill="#555555">every earlier step is 1 hop away - all reads run in parallel - the whole sequence stays on the table</text>
